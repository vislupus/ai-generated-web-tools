<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanical Computer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A1517; --panel:#102225; --raised:#163034; --edge:#20454A; --edge2:#2E6068;
  --verdigris:#5FBFA6; --brass:#D8A63D; --bone:#EFE8D7; --muted:#7C9799; --rust:#C4573A;
  --display:'Bodoni Moda',Georgia,serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{background:var(--ink)}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.55;
  position:relative;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% -10%,#17383d 0%,transparent 60%)}
h1,h2{margin:0;font-weight:400}
button{font-family:var(--body);cursor:pointer}

.shell{max-width:1460px;margin:0 auto;padding:18px 20px 60px}
header.top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--edge);
  padding-bottom:14px;margin-bottom:18px}
.brand{font-family:var(--display);font-size:30px}
.brand em{font-style:italic;color:var(--brass)}
.locator{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;gap:8px}
.btn{background:transparent;border:1px solid var(--edge);color:var(--bone);padding:7px 13px;border-radius:2px;
  font-size:13px;transition:.15s}
.btn:hover:not([disabled]){border-color:var(--verdigris);color:var(--verdigris)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.primary{border-color:var(--brass);color:var(--brass)}
.btn.primary:hover{background:var(--brass);color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.icon{padding:5px 10px;font-family:var(--mono);font-size:13px;line-height:1}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr) 250px;gap:20px;align-items:start}
@media(max-width:1140px){.layout{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--edge);border-radius:3px;padding:16px}
.card + .card{margin-top:14px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ptitle{font-family:var(--display);font-size:25px;line-height:1.15;margin-bottom:10px}
.prose{font-size:14px;color:#CFD9D6}
.prose p{margin:0 0 10px}
.objective{border-left:2px solid var(--brass);padding-left:11px;margin:12px 0;font-size:14px}
.constraints{list-style:none;padding:0;margin:8px 0 0;font-size:13px;color:var(--muted)}
.constraints li:before{content:"—  ";color:var(--edge)}

.map{display:flex;flex-direction:column;gap:1px}
.map-ch{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.map-row{display:flex;gap:9px;align-items:center;background:none;border:0;padding:5px 6px;border-radius:2px;
  color:var(--muted);text-align:left;font-size:13px;width:100%}
.map-row:hover:not([disabled]){background:var(--raised);color:var(--bone)}
.map-row[disabled]{opacity:.4}
.map-row.active{color:var(--brass)}
.map-num{font-family:var(--mono);font-size:11px;width:18px;flex:none}
.map-dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--edge);flex:none}
.map-row.done .map-dot{background:var(--verdigris);border-color:var(--verdigris)}
.map-row.active .map-dot{border-color:var(--brass)}

/* ---------- workbench ---------- */
.bench-wrap{background:var(--panel);border:1px solid var(--edge);border-radius:3px;display:flex;flex-direction:column}
.bench-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.bench-title{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.zoomlabel{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:38px;text-align:center}
.viewport{position:relative;overflow:auto;height:440px;scrollbar-width:thin;
  background-image:linear-gradient(var(--raised) 1px,transparent 1px),linear-gradient(90deg,var(--raised) 1px,transparent 1px);
  background-size:26px 26px}
.bench-wrap:fullscreen{border:0;border-radius:0}
.bench-wrap:fullscreen .viewport{height:calc(100vh - 42px)}
.sizer{position:relative}
.canvas{position:absolute;left:0;top:0;width:600px;height:300px;transform-origin:0 0}
#wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#wires path.hit{pointer-events:stroke;stroke:transparent;stroke-width:16;cursor:pointer;fill:none}

.comp{position:absolute;background:var(--raised);border:1px solid var(--edge2);border-radius:3px;
  padding:0 46px 8px 46px;min-width:150px;z-index:2;user-select:none}
.comp.dragging{z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.comp.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.comp.sel .grip{color:var(--brass)}
.grip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-align:center;padding:5px 0 6px;cursor:grab;border-bottom:1px solid var(--edge);margin:0 -46px 7px;
  background:rgba(0,0,0,.18)}
.grip:active{cursor:grabbing}
.comp-kill{position:absolute;top:2px;right:4px;background:none;border:0;color:var(--edge2);font-size:15px;
  line-height:1;padding:2px 5px;z-index:3}
.comp-kill:hover{color:var(--rust)}

.port{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);
  padding:0;transform:translateY(-50%);z-index:4}
.port:hover{border-color:var(--verdigris);background:var(--verdigris)}
.port.value{border-radius:2px}
.port.armed{background:var(--brass);border-color:var(--brass);box-shadow:0 0 0 5px rgba(216,166,61,.22)}
.port.in{left:-8px} .port.out{right:-8px}
.plabel{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--muted);
  transform:translateY(-50%);white-space:nowrap;pointer-events:none}
.plabel.in{left:10px} .plabel.out{right:10px}

.dial{display:block;margin:0 auto}
.dial .face{fill:var(--panel);stroke:var(--edge2)}
.dial .ring{fill:none;stroke:var(--edge);stroke-width:1}
.dial .digit{font-family:var(--mono);font-size:12px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;
  transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.dial .digit.on{fill:var(--bone);font-weight:600}
.dial .pointer{fill:var(--brass)}
.rotor{transition:transform .22s cubic-bezier(.3,1.5,.5,1);transform-origin:50px 50px}
@media (prefers-reduced-motion:reduce){.rotor,.dial .digit{transition:none}}
.readchip{font-family:var(--mono);font-size:15px;text-align:center;color:var(--bone);margin-top:2px}

.crank-btn{display:block;margin:2px auto 0;background:var(--panel);border:1px solid var(--brass);color:var(--brass);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:7px 16px;border-radius:2px}
.crank-btn:hover{background:var(--brass);color:var(--ink)}
.crank-btn:active{transform:scale(.95)}
.bell{width:42px;height:42px;margin:2px auto;border-radius:50%;border:1px solid var(--edge2);display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;color:var(--muted)}
.bell.lit{border-color:var(--brass);color:var(--brass);box-shadow:0 0 18px rgba(216,166,61,.35)}
.screen{min-width:58px;height:40px;margin:2px auto;border:1px solid var(--edge2);background:#08191B;border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;color:var(--verdigris)}
.screen.blank{color:var(--edge2)}
.cam{width:44px;height:44px;margin:2px auto;border-radius:50%;border:2px dashed var(--brass);display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--brass)}
.lever{display:block;margin:2px auto;width:46px;height:56px;background:var(--panel);border:1px solid var(--edge2);
  border-radius:2px;position:relative;color:var(--muted);font-family:var(--mono);font-size:12px}
.lever b{position:absolute;bottom:2px;left:0;right:0;font-weight:400}
.lever-arm{position:absolute;left:21px;bottom:16px;width:4px;height:24px;background:var(--muted);
  transform-origin:50% 100%;transform:rotate(28deg);transition:transform .18s}
.lever.up{border-color:var(--brass);color:var(--brass)}
.lever.up .lever-arm{background:var(--brass);transform:rotate(-28deg)}
.chip{margin:2px auto;padding:9px 12px;border:1px solid var(--edge2);border-radius:2px;font-family:var(--mono);
  font-size:11px;color:var(--muted);text-align:center;width:max-content}
.chip.on{color:var(--verdigris);border-color:var(--verdigris)}
.drum{display:flex;gap:5px;margin:2px auto;padding:6px;border:1px solid var(--edge2);border-radius:2px;width:max-content}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 4px;border-radius:2px}
.slot.on{background:rgba(216,166,61,.16);box-shadow:inset 0 0 0 1px var(--brass)}
.slot i{width:9px;height:9px;border-radius:50%;border:1px solid var(--edge2);display:block}
.slot i.on{background:var(--brass);border-color:var(--brass)}
.slot u{font-family:var(--mono);font-size:9px;color:var(--muted);text-decoration:none}
.picker{margin:2px auto;padding:6px 12px;border:1px solid var(--edge2);border-radius:2px;text-align:center;
  min-height:86px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.picker span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.picker b{font-family:var(--mono);font-size:20px;color:var(--verdigris);font-weight:400}
.arm{margin:2px auto;padding:9px 12px;border:1px solid var(--edge2);border-radius:2px;font-family:var(--mono);
  font-size:11px;color:var(--verdigris);text-align:center;width:max-content}

.tests{margin-top:14px}
.trow{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:6px 0;border-bottom:1px solid var(--raised)}
.tmark{font-family:var(--mono);font-size:12px;width:16px;flex:none}
.tmark.pass{color:var(--verdigris)} .tmark.fail{color:var(--rust)}
.tdetail{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;text-align:right}
.verdict{margin-top:12px;font-size:14px}
.verdict.pass{color:var(--verdigris)} .verdict.fail{color:var(--rust)}

.part{display:flex;gap:10px;align-items:flex-start;background:none;border:1px solid var(--edge);border-radius:2px;
  color:var(--bone);padding:9px 10px;width:100%;text-align:left;margin-bottom:7px;font-size:13px}
.part:hover:not([disabled]){border-color:var(--verdigris)}
.part[disabled]{opacity:.35;cursor:not-allowed}
.part small{display:block;color:var(--muted);font-size:11px;line-height:1.4}
.part .qty{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;flex:none}
.hint{border-left:2px solid var(--edge);padding:8px 0 8px 11px;margin-bottom:9px;font-size:13px;color:#CFD9D6}

.hint b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px}
.answer{margin-top:6px}
.answer .row{padding:5px 0;border-bottom:1px solid var(--raised)}
.answer .row:last-child{border-bottom:0}
.answer .from,.answer .to{display:block;font-size:12px;line-height:1.35}
.answer .to{padding-left:14px;color:var(--muted)}
.answer .hint b,.answer b{all:unset;font-family:var(--mono);font-size:11px;color:var(--brass)}
.answer .step{font-size:12px;color:var(--verdigris);padding:5px 0}

.veil{position:fixed;inset:0;background:rgba(5,12,13,.82);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50}
.veil[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--brass);border-radius:3px;max-width:560px;width:100%;
  padding:26px;max-height:88vh;overflow:auto}
.modal.wide{max-width:940px}
.modal h2{font-family:var(--display);font-size:27px;margin-bottom:6px}
.reflect{border:1px solid var(--edge);border-radius:2px;padding:13px;margin:16px 0;font-size:14px}
.reflect b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brass);margin-bottom:5px}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px;margin-top:14px}
.lib-card{border:1px solid var(--edge);border-radius:3px;padding:12px}
.lib-card h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brass);margin:0 0 8px;font-weight:500}
.lib-card svg{display:block;margin:0 auto 10px;background:#0B1B1E;border-radius:2px}
.lib-card p{margin:0 0 7px;font-size:12.5px;line-height:1.5;color:#CFD9D6}
.lib-card p b{color:var(--verdigris);font-weight:500}
.lib-stroke{stroke:var(--edge2);fill:none;stroke-width:2}
.lib-metal{fill:#1B3438;stroke:var(--muted);stroke-width:1.5}
.lib-brass{fill:none;stroke:var(--brass);stroke-width:2}
.lib-brass-f{fill:var(--brass)}
.lib-txt{font-family:var(--mono);font-size:13px;fill:var(--bone);text-anchor:middle;dominant-baseline:central}
@keyframes lib-spin{to{transform:rotate(360deg)}}
@keyframes lib-nudge{0%,55%,100%{transform:translateX(0)}25%{transform:translateX(10px)}}
@keyframes lib-pawl{0%,60%,100%{transform:rotate(0deg)}30%{transform:rotate(-16deg)}}
@keyframes lib-follow{0%,55%,100%{transform:translateX(0)}22%{transform:translateX(11px)}}
@keyframes lib-swing{0%,10%{transform:rotate(0deg)}45%,55%{transform:rotate(34deg)}90%,100%{transform:rotate(0deg)}}
@keyframes lib-tap{0%,72%,100%{transform:rotate(0deg)}82%{transform:rotate(-24deg)}}
@keyframes lib-shutter{0%,45%{transform:translateY(0)}60%,90%{transform:translateY(-46px)}100%{transform:translateY(0)}}
@keyframes lib-travel{0%,55%{transform:translateX(0)}60%{transform:translateX(0)}88%,100%{transform:translateX(150px)}}
@keyframes lib-flip{0%,45%{transform:rotate(0deg)}55%,100%{transform:rotate(38deg)}}
@keyframes lib-wipe{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes lib-drum{to{transform:translateX(-132px)}}
@keyframes lib-feel{0%,70%{transform:rotate(0deg)}80%,95%{transform:rotate(7deg)}100%{transform:rotate(0deg)}}
@keyframes lib-latch{0%,45%{transform:rotate(0deg)}55%,100%{transform:rotate(-46deg)}}
@keyframes lib-ring{0%,70%{opacity:0}80%{opacity:.9}100%{opacity:0}}
.a-spin{animation:lib-spin 4s linear infinite}
.a-spin-step{animation:lib-spin 6s steps(10) infinite}
.a-nudge{animation:lib-nudge 4s linear infinite}
.a-pawl{animation:lib-pawl .6s linear infinite}
.a-follow{animation:lib-follow 1s linear infinite}
.a-swing{animation:lib-swing 3s ease-in-out infinite}
.a-tap{animation:lib-tap 2s ease-in-out infinite}
.a-ring{animation:lib-ring 2s ease-in-out infinite}
.a-shutter{animation:lib-shutter 3s ease-in-out infinite}
.a-travel{animation:lib-travel 3s linear infinite}
.a-flip{animation:lib-flip 3s ease-in-out infinite}
.a-wipe{animation:lib-wipe 6s steps(4) infinite}
.a-drumroll{animation:lib-drum 6s steps(4) infinite}
.a-feel{animation:lib-feel 6s ease-in-out infinite}
.a-latch{animation:lib-latch 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .a-spin,.a-spin-step,.a-nudge,.a-pawl,.a-follow,.a-swing,.a-tap,.a-ring,
  .a-shutter,.a-travel,.a-flip,.a-wipe,.a-drumroll,.a-feel,.a-latch{animation:none}
}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--edge2);
  padding:9px 16px;border-radius:2px;font-size:13px;z-index:60}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1 class="brand">Mechanical <em>Computer</em></h1>
    <span class="locator" id="locator"></span>
    <div class="top-actions">
      <button class="btn" id="btn-library">Parts library</button>
      <button class="btn" id="btn-tidy">Tidy layout</button>
      <button class="btn" id="btn-clear">Clear rods</button>
      <button class="btn" id="btn-reset">Reset progress</button>
    </div>
  </header>

  <div class="layout">
    <div>
      <section class="card">
        <div class="eyebrow" id="p-eyebrow"></div>
        <h2 class="ptitle" id="p-title"></h2>
        <div class="prose" id="p-problem"></div>
        <div class="objective" id="p-objective"></div>
        <div class="eyebrow" style="margin-top:14px">Rules of the bench</div>
        <ul class="constraints" id="p-constraints"></ul>
      </section>
      <section class="card">
        <div class="eyebrow">Campaign</div>
        <div class="map" id="map"></div>
      </section>
    </div>

    <div>
      <div class="bench-wrap" id="bench-wrap">
        <div class="bench-head">
          <span class="bench-title">Workbench</span>
          <span class="zoomlabel" id="wirecount"></span>
          <div class="tools">
            <button class="btn icon" id="z-out" title="Zoom out">−</button>
            <span class="zoomlabel" id="z-label">100%</span>
            <button class="btn icon" id="z-in" title="Zoom in">+</button>
            <button class="btn icon" id="z-fit" title="Reset zoom">⤢</button>
            <button class="btn icon" id="z-full" title="Full screen">⛶</button>
          </div>
        </div>
        <div class="viewport" id="viewport">
          <div class="sizer" id="sizer"><div class="canvas" id="canvas"><svg id="wires"></svg></div></div>
        </div>
      </div>
      <section class="card tests">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span class="eyebrow" style="margin:0">Test bench</span>
          <button class="btn primary" id="btn-test" style="margin-left:auto">Run tests</button>
        </div>
        <div id="test-results"></div>
      </section>
    </div>

    <div>
      <section class="card">
        <div class="eyebrow">Parts bin</div>
        <div id="parts"></div>
      </section>
      <section class="card">
        <div class="eyebrow">Hints</div>
        <div id="hints"></div>
        <button class="btn" id="btn-hint" style="width:100%">Ask for a hint</button>
      </section>
    </div>
  </div>
</div>

<div class="veil" id="veil" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* =================== SIM-START =================== *
 * LAYER 1 — SIMULATION MODEL
 * Components, ports, rods, signal propagation. No DOM, no pixels, no puzzles.
 *
 * Two kinds of signal:
 *   pulse — a momentary push. It happens at an instant and is then over.
 *   value — a continuous reading, like the angle of a shaft. Always true.
 * ================================================= */
const DEFS = {
  crank: {
    label:'Crank', blurb:'Push it once and it sends a single pulse down its output rod.',
    ins:[], outs:[{id:'OUT',kind:'pulse'}],
    init:()=>({}), onPulse:()=>{}
  },
  wheel: {
    label:'Number wheel', blurb:'Holds one digit. Steps one notch forward or backward at a time.',
    ins:[{id:'STEP+',kind:'pulse'},{id:'STEP-',kind:'pulse'}],
    outs:[{id:'CARRY',kind:'pulse'},{id:'BORROW',kind:'pulse'},{id:'VALUE',kind:'value'}],
    init:(c)=>({pos:c.start||0}),
    onPulse:(c,port,emit)=>{
      const N=c.N;
      if(port==='STEP+'){ const from=c.pos; c.pos=(c.pos+1)%N; if(from===N-1) emit('CARRY'); }
      else if(port==='STEP-'){ const from=c.pos; c.pos=(c.pos-1+N)%N; if(from===0) emit('BORROW'); }
    }
  },
  bell: {
    label:'Signal bell', blurb:'Rings each time a pulse reaches it and remembers the count.',
    ins:[{id:'IN',kind:'pulse'}], outs:[],
    init:()=>({count:0}),
    onPulse:(c,port)=>{ if(port==='IN') c.count++; }
  },
  readout: {
    label:'Readout', blurb:'Shows the value of whatever shaft it is connected to, at all times.',
    ins:[{id:'IN',kind:'value'}], outs:[],
    init:()=>({}), onPulse:()=>{}
  },
  repeater: {
    label:'Cam', blurb:'One pulse in, a fixed number of pulses out. The count is cut into the cam.',
    ins:[{id:'IN',kind:'pulse'}], outs:[{id:'OUT',kind:'pulse'}],
    init:()=>({}),

function makeMachine(puzzle){
  const m={comps:{},wires:[],seq:0};
  (puzzle.fixed||[]).forEach(spec=>addComp(m,spec.type,spec,true));
  return m;
}
function addComp(m,type,spec,fixed){
  spec=spec||{};
  const id=spec.id||(type+'_'+(++m.seq));
  const base={id,type,fixed:!!fixed,label:spec.label||DEFS[type].label,
              N:spec.N||10,start:spec.start||0,times:spec.times||1,
              program:spec.program||[[0,0]],
              x:spec.x!==undefined?spec.x:40,y:spec.y!==undefined?spec.y:40};
  m.comps[id]=Object.assign(base,DEFS[type].init(base));
  return m.comps[id];
}
function removeComp(m,id){ delete m.comps[id]; m.wires=m.wires.filter(w=>w.from!==id&&w.to!==id); }
function portDef(type,dir,id){ return DEFS[type][dir==='in'?'ins':'outs'].find(p=>p.id===id); }

/* A rod is legal when it joins an output to an input of the same signal kind.
   Outputs may fan out freely: one shaft can drive several parts.
   Several rods may push the same PULSE input — two levers can shove the same
   lever, and the pushes simply happen one after another. A VALUE input takes
   one rod only, because two shafts cannot both hold a dial at a reading. */
function canWire(m,from,fromPort,to,toPort){
  if(!m.comps[from]||!m.comps[to]) return 'missing part';
  if(from===to) return 'a part cannot drive itself';
  const a=portDef(m.comps[from].type,'out',fromPort), b=portDef(m.comps[to].type,'in',toPort);
  if(!a||!b) return 'that is not an output feeding an input';
  if(a.kind!==b.kind) return a.kind==='pulse'?'a pulse rod cannot feed a reading dial'
                                             :'a reading shaft cannot deliver a pulse';
  if(b.kind==='value'&&m.wires.some(w=>w.to===to&&w.toPort===toPort))
    return 'a reading input takes one shaft only';
  if(m.wires.some(w=>w.from===from&&w.fromPort===fromPort&&w.to===to&&w.toPort===toPort))
    return 'that rod is already there';
  return null;
}
function addWire(m,from,fromPort,to,toPort){
  const bad=canWire(m,from,fromPort,to,toPort);
  if(bad) return bad;
  m.wires.push({from,fromPort,to,toPort});
  return null;
}
/* Reads whatever value-shaft feeds the given input port. A shaft may pass
   through a picker, which is why this is written as a short chain rather than
   a single lookup. The depth guard stops a loop of pickers hanging the bench. */
function valueOf(m,id,port,depth){
  depth=depth||0; if(depth>10) return null;
  const c=m.comps[id]; if(!c) return null;
  if(c.type==='picker'){
    const a=readPort(m,id,'ADDR',depth+1)||0;
    return readPort(m,id,'IN-'+a,depth+1);
  }
  if(c.type==='drum'){
    const ins=(c.program&&c.program[c.slot])||[0,0];
    if(port==='TRACK-A') return ins[0];
    if(port==='TRACK-B') return ins[1];
    return c.slot;
  }
  if(c.type==='seq2'||c.type==='seq4') return c.step;
  if(c.type==='zero'){
    const v=readPort(m,id,'WATCH',depth+1);
    if(v===null) return null;
    return port==='NOT-ZERO' ? (v?1:0) : (v?0:1);
  }
  return c.pos!==undefined?c.pos:null;
}
function readPort(m,compId,portId,depth){
  const w=m.wires.find(x=>x.to===compId&&x.toPort===portId);
  return w?valueOf(m,w.from,w.fromPort,(depth||0)+1):null;
}
function readValue(m,compId){ return readPort(m,compId,'IN'); }

/* One push travels all the way through the linkage before the next one starts.
   That is depth-first, and it is not a detail: if a later part of the machine
   ran before the end of the current push, a program drum could advance while
   the pulse from the previous slot was still finding its way through the
   selectors. Rods are followed in the order they were built, so the same
   machine and the same input always give the same result. */
function firePulse(m,compId,portId){
  const trace=[]; const stack=[{id:compId,port:portId,depth:0}]; let guard=0;
  const ctx={machine:m};
  while(stack.length&&guard++<200000){
    const job=stack.pop();
    const c=m.comps[job.id]; if(!c) continue;
    const outbox=[];
    if(job.port==='OUT'&&c.type==='crank') outbox.push('OUT');
    else DEFS[c.type].onPulse(c,job.port,p=>outbox.push(p),ctx);
    const targets=[];
    for(const out of outbox){
      for(const w of m.wires){
        if(w.from===job.id&&w.fromPort===out){
          trace.push({wire:w,depth:job.depth});
          targets.push({id:w.to,port:w.toPort,depth:job.depth+1});
        }
      }
    }
    for(let i=targets.length-1;i>=0;i--) stack.push(targets[i]);
  }
  return trace;
}
function resetState(m){ for(const id in m.comps){ const c=m.comps[id]; Object.assign(c,DEFS[c.type].init(c)); } }
function cloneMachine(m){
  const n={comps:{},wires:m.wires.map(w=>Object.assign({},w)),seq:m.seq};
  for(const id in m.comps) n.comps[id]=Object.assign({},m.comps[id]);
  return n;
}
/* =================== SIM-END =================== */

  'Crank OUT → units STEP+. Units CARRY → tens STEP+. Then units VALUE → units readout, tens VALUE → tens readout. Four rods.'
 ],
 explain:`This is <b>positional notation</b> made out of metal.

The wheels are identical. Nothing about the upper wheel says "tens" — its meaning comes entirely from where it sits in the chain. It advances once for every ten advances of its neighbour, so its digit is worth ten times as much. That is the whole idea behind writing 47 rather than making forty-seven marks.

Blaise Pascal built exactly this in 1642, and the carry was the hard part: a falling weight called a <i>sautoir</i> was lifted as the units wheel passed nine and dropped to shove the tens wheel round. Your rod is an honest picture of what that linkage does, though a real one must survive the force of nine wheels carrying at once — a genuine engineering problem this simulation does not model.`,
 reflect:'On turn 100 the whole machine returned to 00. Is that the same kind of event as a single wheel rolling over, or a different one? Where would you attach a bell to catch it?'
},
{

  {label:'Ninety-nine → 099',actions:[T('turn',99)],expect:[{comp:'dHuns',prop:'value',eq:0},{comp:'dTens',prop:'value',eq:9},{comp:'dUnits',prop:'value',eq:9},{comp:'bell',prop:'count',eq:0}]},

  {label:'Five hundred and six → 506',actions:[T('turn',506)],expect:[{comp:'dHuns',prop:'value',eq:5},{comp:'dTens',prop:'value',eq:0},{comp:'dUnits',prop:'value',eq:6},{comp:'bell',prop:'count',eq:0}]},

  {label:'One thousand → 000, bell rings once',actions:[T('turn',1000)],expect:[{comp:'dHuns',prop:'value',eq:0},{comp:'dTens',prop:'value',eq:0},{comp:'dUnits',prop:'value',eq:0},{comp:'bell',prop:'count',eq:1}]}
 ],
 hints:[
  'The two-digit machine was a chain. A chain does not care how long it is.',
  'Each wheel takes its pushes from the wheel below it and passes its rollover to the wheel above.',
  'The hundreds wheel is the end of the chain. When it rolls over there is no fourth wheel to receive the carry — which is exactly the moment the clerk wants to know about.',
  'Crank → units STEP+. Units CARRY → tens STEP+. Tens CARRY → hundreds STEP+. Hundreds CARRY → bell IN. Then each wheel\u2019s VALUE to its own readout.'
 ],
 explain:`Three wheels wired in a chain form a <b>register</b>: a fixed-width container for a number, made of identical parts whose meaning comes from position.

The last carry in the chain has nowhere to go, and that is not a fault in your wiring — it is the definition of the machine\u2019s capacity. Your register holds 0 to 999 and no more. Add a fourth wheel and it holds 0 to 9999. No arrangement of finite parts holds every number, so every real machine has a width and a bell.

Modern processors still ring this bell. It is called the carry flag, and a program that ignores it gets wrong answers silently — exactly as your clerk would.`,
 reflect:'You have built a machine that counts by one. To add 25 somebody must turn the crank twenty-five times and count carefully — the very job the machine was supposed to take over. What would have to change so the machine could add 25 in a single operation?'
},

  {label:'Seven turns → 35',actions:[T('turn',7)],expect:[{comp:'dTens',prop:'value',eq:3},{comp:'dUnits',prop:'value',eq:5}]},

 hints:[
  'The crank should not touch a wheel at all this time. Something goes between them.',
  'The cam takes one pulse and gives back five. Put it in the path.',
  'Crank OUT feeds the cam IN. The cam OUT feeds the units wheel. The carry chain from the last chapter is unchanged.',
  'Crank OUT → cam IN. Cam OUT → units STEP+. Units CARRY → tens STEP+. Then both VALUE ports to their readouts.'
 ],
 explain:`You have just built the first thing in this game that deserves to be called an <b>operation</b> rather than a movement.

Turning the crank once no longer means "advance one notch". It means "add five", and the five is stored in the shape of the cam, not in the effort of the operator. The machine now contains a number that nobody has to remember.

This is the same trick as multiplication by repeated addition, seen from the other end, and it is the foundation of every instruction a computer has ever had: a single command that stands for a fixed amount of work.`,
 reflect:'The five lives in the cam. To add seven instead you must fetch a different cam from the drawer. What would you need on the bench so the amount could be changed without swapping parts?'
},
{

 hints:[
  'The arm needs two different things: something to feel, and something to set it off. They arrive on different kinds of port.',
  'COUNT is square — it wants a reading. TRIGGER is round — it wants a pulse.',
  'The input wheel\u2019s VALUE tells the arm how far to swing. The ADD crank tells it when. The arm\u2019s OUT drives the accumulator, which still needs its own carry chain.',
  'Set-input crank → B STEP+. B VALUE → arm COUNT and also → input readout. ADD crank → arm TRIGGER. Arm OUT → A STEP+. A CARRY → At STEP+. Both accumulator wheels → their readouts.'
 ],
 explain:`This is <b>addition</b>, and it is worth being precise about what just happened.

The arm converted a <i>value</i> — a shaft resting at position 7 — into a <i>count of pulses</i>. That conversion is the entire trick. Nothing in the machine knows arithmetic; the accumulator simply receives seven pushes and its carry chain sorts out the digits.

Notice too that the two numbers play different roles. The input wheel is read and left alone. The accumulator is changed and keeps its result for next time. That asymmetry — one operand consumed, one operand updated in place — is exactly how the accumulator worked in real machines from the Pascaline to the earliest electronic computers.`,
 reflect:'Your accumulator holds two digits, so it dies at 99. If you added a hundreds wheel, what single rod would you have to add — and does anything else in the machine need to change?'
},

 hints:[
  'You already solved this problem once, in the other direction. Look at what you built for counting up and ask what its mirror image would be.',
  'The units wheel has an output you have used only once, back when the bell was on the bench.',
  'CARRY fires when the wheel rolls forward past 9. BORROW fires when it rolls backward past 0. The tens wheel has an input for each direction.',
  'Up crank → units STEP+. Down crank → units STEP−. Units CARRY → tens STEP+. Units BORROW → tens STEP−. Plus the two readouts.'
 ],
 explain:`<b>Borrowing</b> is not a new mechanism. It is the carry running backwards.

That symmetry is the reason the same column of wheels can serve both addition and subtraction. Look at the last test: stepping down from 00 gives 99, not −1. The register has no way to represent a negative number, so it wraps, exactly as it wrapped at the top. Whether 99 means "ninety-nine" or "minus one" is a decision made by whoever reads the machine, not by the machine.

That is not a quirk of your bench. Modern processors do the identical thing, and the convention that lets the top of the range stand for negative numbers is called two's complement.`,
 reflect:'After stepping down from 00 the machine shows 99. What extra part would you need for the machine itself to know that it had gone below zero, rather than leaving the clerk to guess?'
},

  'Arm OUT → A STEP−, and A BORROW → At STEP−. FILL → A STEP+ with A CARRY → At STEP+. Set-input crank → B STEP+, B VALUE → arm COUNT.'

 explain:`Subtraction turned out to need no new mechanism at all — only a rod attached to a different port.

That is worth sitting with. The transfer arm converts a number into a count of pushes; the accumulator has two ways to receive pushes; and the choice of which one is wired decides whether the machine adds or subtracts. A machine that could <i>change that choice on command</i> would be able to do either operation without being rebuilt.

Nobody has given you the part that makes that choice yet. When they do, in Chapter 4, it will be called a selector, and it is the difference between a machine that does one job and a machine that can be told what to do.`,

 hints:[
  'Multiplying by four means adding the same number four times. You already have a part that adds a number once, and a part that turns one pulse into four.',
  'Which one comes first? Ask what each part needs from the other: the cam needs a pulse, the arm needs a pulse and a reading.',
  'The cam should not drive the accumulator directly — that would add four, not four lots of the input. The cam should be setting off the arm.',
  'MULTIPLY crank → cam IN. Cam OUT → arm TRIGGER. Input VALUE → arm COUNT. Arm OUT → A STEP+. A CARRY → At STEP+. Readouts on both accumulator wheels.'
 ],
 explain:`You have written your first <b>algorithm</b> — a result obtained not by a part that knows how to do it, but by a sequence of simpler operations arranged in the right order.

Nothing on that bench multiplies. The cam repeats, the arm adds, the wheels carry. Multiplication is what those three things <i>amount to</i> when connected in that order, and connecting them in a different order gives a different result rather than an error.

This is the point where the game stops being about parts. Everything from here on is about arranging operations in time: which happens first, which repeats, and which depends on the result of the last one.`,

 parts:[],
 tests:[
  {label:'Lever down: five turns change nothing',actions:[{lever:'hold',to:0},T('drive',5)],expect:[{comp:'dR',prop:'value',eq:0}]},
  {label:'Lever up: three turns count',actions:[{lever:'hold',to:1},T('drive',3)],expect:[{comp:'dR',prop:'value',eq:3}]},
  {label:'Up two, down five: still 2',actions:[{lever:'hold',to:1},T('drive',2),{lever:'hold',to:0},T('drive',5)],expect:[{comp:'dR',prop:'value',eq:2}]},
  {label:'Up four, down three, up one: 5',actions:[{lever:'hold',to:1},T('drive',4),{lever:'hold',to:0},T('drive',3),{lever:'hold',to:1},T('drive',1)],expect:[{comp:'dR',prop:'value',eq:5}]},
  {label:'Lever down from the start: nothing at all',actions:[{lever:'hold',to:0},T('drive',12)],expect:[{comp:'dR',prop:'value',eq:0}]}
 ],
 hints:[
  'The crank must no longer reach the wheel directly. Something has to stand between them.',
  'The gate has two inputs of different shapes: one accepts the push, one accepts a reading that decides whether the push gets through.',
  'The lever produces a value — 1 when up, 0 when down. The gate\u2019s ENABLE wants exactly that.',
  'Drive OUT → gate IN. Lever STATE → gate ENABLE. Gate OUT → register STEP+. Register VALUE → readout.'
 ],
 explain:`A wheel that changes whenever anything moves is not storage. Storage is the ability to <b>refuse</b> to change.

That is the whole content of this puzzle, and it is easy to under-rate. Everything before now was about making things move. A register is the opposite idea: a number that stays put while the rest of the machine works around it, and changes only when something explicitly says so.

The lever is a <b>write enable</b>. Every memory ever built has one, from a mechanical latch to a chip: the storage element and the signal granting permission to disturb it are separate parts.`,
 reflect:'The lever is thrown by hand. If the machine were to raise and lower it on its own, what would be deciding when — and how would that thing know?'
},

  {label:'Set 6, clear, copy → 6',actions:[T('setR1',6),T('clear',1),T('copy',1)],expect:[{comp:'dR2',prop:'value',eq:6},{comp:'dR1',prop:'value',eq:6}]},
  {label:'Doing it twice gives the same 4',actions:[T('setR1',4),T('clear',1),T('copy',1),T('clear',1),T('copy',1)],expect:[{comp:'dR2',prop:'value',eq:4}]},
  {label:'Copying a zero gives zero',actions:[T('setR1',0),T('clear',1),T('copy',1)],expect:[{comp:'dR2',prop:'value',eq:0}]},
  {label:'CLEAR empties a full register',actions:[T('setR1',7),T('copy',1),T('clear',1)],expect:[{comp:'dR2',prop:'value',eq:0}]},
  {label:'Set 9, clear, copy → 9 and the source survives',actions:[T('setR1',9),T('clear',1),T('copy',1)],expect:[{comp:'dR2',prop:'value',eq:9},{comp:'dR1',prop:'value',eq:9}]}
 ],
 hints:[
  'Adding into an empty register is the same thing as copying into it. So the question is how to empty one.',
  'A transfer arm sends out as many pulses as the wheel it is reading. What happens if an arm reads the very wheel it drives — backwards?',
  'The clearing arm reads register 2 and steps register 2 down. The copying arm reads register 1 and steps register 2 up.',
  'Set crank → R1 STEP+. R1 VALUE → copying arm COUNT and to its readout. CLEAR → clearing arm TRIGGER, R2 VALUE → clearing arm COUNT, clearing arm OUT → R2 STEP−. COPY → copying arm TRIGGER, copying arm OUT → R2 STEP+. R2 VALUE → its readout.'
 ],
 explain:`Copying turned out to be two operations, not one: empty the destination, then add the source into it.

Notice what the clearing arm does. It reads a register and subtracts that same amount from it — a machine subtracting a number from itself to reach a known state. There is no "erase" in mechanism. Emptying is something you <i>compute</i>.

Notice also the order. CLEAR then COPY gives the right answer; COPY then CLEAR gives zero. The parts are identical, the wiring is identical, and only the sequence differs. You have just met the problem the whole of Chapter 5 exists to solve: at the moment, the correct order lives in the operator\u2019s head, not in the machine.`,
 reflect:'You pressed two cranks in a particular order. What would a part have to do to press them for you — and how would it know which comes first?'
},
{
 id:'p16', chapter:'Chapter 4 · Storage', title:'Which One Gets It', concept:'control signals',
 problem:`Back in Chapter 3 the direction of an operation was decided by where you bolted the rod, permanently. A selector has now arrived. It takes one pulse and sends it down one of two paths, and which path is decided by a shaft rather than by a spanner.`,
 objective:'Make the ADD operation deposit the input number into register 1 or register 2, according to the lever.',
 constraints:['One transfer arm only. The same arm must serve both registers.','The lever must be able to change between additions.'],
 fixed:[{type:'crank',id:'setB',label:'Set input',x:20,y:20},
        {type:'wheel',id:'B',label:'Input wheel',N:10,x:200,y:10},
        {type:'readout',id:'dB',label:'Input readout',x:430,y:40},
        {type:'crank',id:'add',label:'ADD',x:20,y:250},
        {type:'transfer',id:'arm',label:'Transfer arm',x:200,y:250},
        {type:'selector',id:'sel',label:'Selector',x:410,y:245},
        {type:'lever',id:'pick',label:'Destination lever',x:410,y:420},
        {type:'wheel',id:'R1',label:'Register 1',N:10,x:630,y:150},
        {type:'readout',id:'dR1',label:'Register 1 readout',x:850,y:180},
        {type:'wheel',id:'R2',label:'Register 2',N:10,x:630,y:390},
        {type:'readout',id:'dR2',label:'Register 2 readout',x:850,y:420}],
 parts:[],
 tests:[
  {label:'Lever down: 4 goes to register 1',actions:[{lever:'pick',to:0},T('setB',4),T('add',1)],expect:[{comp:'dR1',prop:'value',eq:4},{comp:'dR2',prop:'value',eq:0}]},
  {label:'Lever up: 3 goes to register 2',actions:[{lever:'pick',to:1},T('setB',3),T('add',1)],expect:[{comp:'dR1',prop:'value',eq:0},{comp:'dR2',prop:'value',eq:3}]},
  {label:'The same number sent to each in turn',actions:[{lever:'pick',to:0},T('setB',2),T('add',1),{lever:'pick',to:1},T('add',1)],expect:[{comp:'dR1',prop:'value',eq:2},{comp:'dR2',prop:'value',eq:2}]},
  {label:'Adding twice into register 2',actions:[{lever:'pick',to:1},T('setB',3),T('add',2)],expect:[{comp:'dR2',prop:'value',eq:6},{comp:'dR1',prop:'value',eq:0}]},
  {label:'Adding nothing changes nothing',actions:[{lever:'pick',to:0},T('setB',0),T('add',1)],expect:[{comp:'dR1',prop:'value',eq:0},{comp:'dR2',prop:'value',eq:0}]}
 ],
 hints:[
  'The arm still needs a reading and a trigger, exactly as before. What changes is where its pulses go afterwards.',
  'The selector sits between the arm and the registers. It has one pulse input and two pulse outputs.',
  'PICK is a square port: it wants a reading, and the lever is the only part here that produces one without being a wheel.',
  'Input crank → B STEP+. B VALUE → arm COUNT and to the input readout. ADD → arm TRIGGER. Arm OUT → selector IN. Lever STATE → selector PICK. Selector OUT-0 → R1 STEP+, OUT-1 → R2 STEP+. Both registers to their readouts.'
 ],
 explain:`The lever is not data. Nothing is added to it and nothing is read out of it as a quantity. It exists purely to steer another part — and that makes it a <b>control signal</b>.

This is the first real division in your machine. Some shafts carry numbers the clerk cares about; some carry decisions about what the machine should do with those numbers. The same distinction runs through every computer as the split between the data path and the control unit, and keeping the two straight is most of the work of designing one.

Notice also what you no longer have to do: to send a number somewhere else you throw a lever instead of rebuilding the machine.`,
 reflect:'One lever chooses between two destinations. How many destinations could two levers choose between, and why that number?'
},
{
 id:'p17', chapter:'Chapter 4 · Storage', title:'Four Boxes', concept:'memory',
 problem:`One register is storage. Four registers, with a way of choosing which one an operation lands in, is something else — the clerk can put a figure down in one place, work on another, and come back to the first with it untouched. You have four wheels, two levers and three selectors.`,
 objective:'Make each turn of the TICK crank add one to exactly one of the four boxes, chosen by the two levers.',
 constraints:['The three unselected boxes must not move at all.','Levers down-down must reach box 0, and up-up must reach box 3.'],
 fixed:[{type:'crank',id:'tick',label:'TICK',x:20,y:200},
        {type:'lever',id:'L1',label:'Lever A',x:180,y:20},
        {type:'selector',id:'S1',label:'Selector 1',x:180,y:200},
        {type:'lever',id:'L2',label:'Lever B',x:180,y:400},
        {type:'selector',id:'S2',label:'Selector 2',x:370,y:80},
        {type:'selector',id:'S3',label:'Selector 3',x:370,y:330},
        {type:'wheel',id:'C0',label:'Box 0',N:10,x:560,y:10},
        {type:'wheel',id:'C1',label:'Box 1',N:10,x:560,y:180},
        {type:'wheel',id:'C2',label:'Box 2',N:10,x:560,y:350},
        {type:'wheel',id:'C3',label:'Box 3',N:10,x:560,y:520},
        {type:'readout',id:'d0',label:'Box 0 readout',x:790,y:40},
        {type:'readout',id:'d1',label:'Box 1 readout',x:790,y:210},
        {type:'readout',id:'d2',label:'Box 2 readout',x:790,y:380},
        {type:'readout',id:'d3',label:'Box 3 readout',x:790,y:550}],
 parts:[],
 tests:[
  {label:'Down, down → box 0 gets 3',actions:[{lever:'L1',to:0},{lever:'L2',to:0},T('tick',3)],
   expect:[{comp:'d0',prop:'value',eq:3},{comp:'d1',prop:'value',eq:0},{comp:'d2',prop:'value',eq:0},{comp:'d3',prop:'value',eq:0}]},
  {label:'Down, up → box 1 gets 2',actions:[{lever:'L1',to:0},{lever:'L2',to:1},T('tick',2)],
   expect:[{comp:'d1',prop:'value',eq:2},{comp:'d0',prop:'value',eq:0},{comp:'d2',prop:'value',eq:0},{comp:'d3',prop:'value',eq:0}]},
  {label:'Up, down → box 2 gets 5',actions:[{lever:'L1',to:1},{lever:'L2',to:0},T('tick',5)],
   expect:[{comp:'d2',prop:'value',eq:5},{comp:'d0',prop:'value',eq:0},{comp:'d1',prop:'value',eq:0},{comp:'d3',prop:'value',eq:0}]},
  {label:'Up, up → box 3 gets 4',actions:[{lever:'L1',to:1},{lever:'L2',to:1},T('tick',4)],
   expect:[{comp:'d3',prop:'value',eq:4},{comp:'d0',prop:'value',eq:0},{comp:'d1',prop:'value',eq:0},{comp:'d2',prop:'value',eq:0}]},
  {label:'Two boxes filled in one session',actions:[{lever:'L1',to:0},{lever:'L2',to:0},T('tick',2),{lever:'L1',to:1},{lever:'L2',to:1},T('tick',3)],
   expect:[{comp:'d0',prop:'value',eq:2},{comp:'d3',prop:'value',eq:3},{comp:'d1',prop:'value',eq:0},{comp:'d2',prop:'value',eq:0}]}
 ],
 hints:[
  'One selector splits the path in two. You have four destinations and three selectors, which is not a coincidence.',
  'Let the first selector decide between the top pair of boxes and the bottom pair. Then a second selector decides within each pair.',
  'Both of the second-rank selectors are answering the same question, so they can share one lever — an output shaft may feed as many inputs as you like.',
  'TICK → S1 IN. Lever A → S1 PICK. S1 OUT-0 → S2 IN, S1 OUT-1 → S3 IN. Lever B → S2 PICK and also → S3 PICK. S2 OUT-0 → Box 0, OUT-1 → Box 1. S3 OUT-0 → Box 2, OUT-1 → Box 3. Then each box to its readout.'
 ],
 explain:`Two levers, four boxes. Three levers would give eight, four would give sixteen: each lever doubles the number of places you can name, because it splits every path that reached it.

That doubling is why addresses are written in binary even in machines that count in decimal. A pattern of up-and-down levers is not a number the clerk cares about — it is a <b>name</b> for a location, and the tree of selectors is what turns that name into a physical path.

What you have built is <b>memory</b>: not one number held still, but many, each independently reachable, with hardware deciding which one an operation lands on.`,
 reflect:'The levers say where to write. Nothing yet says where to read. Would the same tree of selectors work for reading, or does a reading shaft need something different?'
},
{
 id:'p18', chapter:'Chapter 4 · Storage', title:'By Number', concept:'addressing',
 problem:`Your four boxes can be written to, but reading them means four separate dials and a clerk who knows which to look at. A picker has arrived: four reading shafts go in, one comes out, and a shaft marked ADDR decides which of the four is passed through. There is also a four-notch wheel, which you last saw in Chapter 1.`,
 objective:'Make the single data readout show the contents of whichever box the address wheel is pointing at.',
 constraints:['One readout for the data, one for the address.','Turning the address wheel must not disturb any box.'],
 fixed:[{type:'crank',id:'f0',label:'Fill box 0',x:20,y:20},
        {type:'wheel',id:'C0',label:'Box 0',N:10,x:180,y:10},
        {type:'crank',id:'f1',label:'Fill box 1',x:20,y:180},
        {type:'wheel',id:'C1',label:'Box 1',N:10,x:180,y:170},
        {type:'crank',id:'f2',label:'Fill box 2',x:20,y:340},
        {type:'wheel',id:'C2',label:'Box 2',N:10,x:180,y:330},
        {type:'crank',id:'f3',label:'Fill box 3',x:20,y:500},
        {type:'wheel',id:'C3',label:'Box 3',N:10,x:180,y:490},
        {type:'picker',id:'pick',label:'Picker',x:410,y:190},
        {type:'crank',id:'addrTurn',label:'Address crank',x:20,y:650},
        {type:'wheel',id:'addr',label:'Address wheel',N:4,x:180,y:640},
        {type:'readout',id:'dAddr',label:'Address readout',x:410,y:660},
        {type:'readout',id:'dOut',label:'Data readout',x:630,y:220}],
 parts:[],
 tests:[
  {label:'Address 0 shows box 0',actions:[T('f0',3),T('f2',7)],expect:[{comp:'dOut',prop:'value',eq:3},{comp:'dAddr',prop:'value',eq:0}]},
  {label:'Address 2 shows box 2',actions:[T('f0',3),T('f2',7),T('addrTurn',2)],expect:[{comp:'dOut',prop:'value',eq:7},{comp:'dAddr',prop:'value',eq:2}]},
  {label:'Address 1 shows an empty box',actions:[T('f0',3),T('f2',7),T('addrTurn',1)],expect:[{comp:'dOut',prop:'value',eq:0}]},
  {label:'Address 3 shows box 3',actions:[T('f3',9),T('addrTurn',3)],expect:[{comp:'dOut',prop:'value',eq:9},{comp:'dAddr',prop:'value',eq:3}]},
  {label:'Four turns of the address wheel come back round',actions:[T('f0',5),T('addrTurn',4)],expect:[{comp:'dOut',prop:'value',eq:5},{comp:'dAddr',prop:'value',eq:0}]},
  {label:'Reading does not disturb the boxes',actions:[T('f1',6),T('addrTurn',1),T('addrTurn',2)],expect:[{comp:'dOut',prop:'value',eq:0},{comp:'dAddr',prop:'value',eq:3}]}
 ],
 hints:[
  'Each box needs its own filling crank, and each box needs to offer its reading to the picker.',
  'The picker\u2019s four inputs are numbered. Box 0 belongs on IN-0 if the addresses are to mean anything sensible.',
  'ADDR is a reading, and the address wheel produces one. Four notches, four boxes — that is why this is not a ten-notch wheel.',
  'Each fill crank → its box STEP+. Each box VALUE → the matching picker IN-0…IN-3. Address crank → address wheel STEP+. Address wheel VALUE → picker ADDR and → address readout. Picker VALUE → data readout.'
 ],
 explain:`An <b>address</b> is a number whose meaning is not a quantity but a place.

The address wheel holds 2 exactly as a box holds 7 — the same kind of part, the same kind of shaft. What makes it an address is only what it is wired to. Remember that the next time somebody says a computer distinguishes between kinds of data: at the level of the mechanism it does not. Meaning comes from wiring.

The four-notch wheel is doing real work here. Its range and the number of boxes must agree, which is why a machine\u2019s address width and its memory size are two ways of saying the same thing. Turn the wheel four times and you are back at box 0 — an address that runs off the end of memory wraps rather than reaching anything new.`,
 reflect:'Writing is chosen by two levers; reading is chosen by a four-notch wheel. Both name one of four places. Could one of them drive the other, and what would you gain if it did?'
},

/* ---------------- Chapter 5 ---------------- */
{
 id:'p19', chapter:'Chapter 5 · Sequencing', title:'In the Right Order', concept:'instruction sequencing',
 problem:`You solved copying, but only because you pressed CLEAR and then COPY, in that order, by hand. Press them the other way round and the answer is zero. That order is not in the machine — it is in your head. A distributor has arrived: it deals the first pulse to one output, the next to another, then starts again.`,
 objective:'Make two presses of the STEP crank clear register 2 and then copy register 1 into it, in that order, every time.',
 constraints:['Only the STEP crank may be pressed. There is no separate CLEAR or COPY.','Two presses must always leave register 2 equal to register 1.'],
 fixed:[{type:'crank',id:'setR1',label:'Set register 1',x:20,y:20},
        {type:'wheel',id:'R1',label:'Register 1',N:10,x:200,y:10},
        {type:'readout',id:'dR1',label:'Register 1 readout',x:430,y:40},
        {type:'crank',id:'step',label:'STEP',x:20,y:250},
        {type:'seq2',id:'seq',label:'Distributor',x:190,y:250},
        {type:'transfer',id:'armClear',label:'Clearing arm',x:390,y:210},
        {type:'transfer',id:'armCopy',label:'Copying arm',x:390,y:390},
        {type:'wheel',id:'R2',label:'Register 2',N:10,x:610,y:270},
        {type:'readout',id:'dR2',label:'Register 2 readout',x:840,y:300}],
 parts:[],
 tests:[
  {label:'Set 6, two steps → 6',actions:[T('setR1',6),T('step',2)],expect:[{comp:'dR2',prop:'value',eq:6},{comp:'dR1',prop:'value',eq:6}]},
  {label:'Four steps: the cycle repeats cleanly',actions:[T('setR1',4),T('step',4)],expect:[{comp:'dR2',prop:'value',eq:4}]},
  {label:'One step alone only clears',actions:[T('setR1',7),T('step',1)],expect:[{comp:'dR2',prop:'value',eq:0}]},
  {label:'Six steps still give 3',actions:[T('setR1',3),T('step',6)],expect:[{comp:'dR2',prop:'value',eq:3}]},
  {label:'Copying a zero',actions:[T('setR1',0),T('step',2)],expect:[{comp:'dR2',prop:'value',eq:0}]}
 ],
 hints:[
  'The two arms are wired to registers exactly as they were in Chapter 4. Only their triggers change.',
  'The distributor turns a stream of identical pulses into a fixed rotation of different ones.',
  'The clearing arm must be triggered on the distributor\u2019s first output, the copying arm on its second — that is what puts the order into the metal.',
  'STEP → distributor IN. Distributor OUT-0 → clearing arm TRIGGER. OUT-1 → copying arm TRIGGER. R2 VALUE → clearing arm COUNT, clearing arm OUT → R2 STEP−. R1 VALUE → copying arm COUNT and its readout, copying arm OUT → R2 STEP+. R2 VALUE → its readout.'
 ],
 explain:`The order has moved out of the operator and into the mechanism.

That is the whole idea of a <b>sequence of instructions</b>. The distributor does not know what clearing or copying are; it only knows first, second, first, second. The meaning comes from what each of its outputs is wired to. Change the wiring and the same distributor performs a different pair of operations in the same order.

Note the price. Press STEP an odd number of times and you catch the machine mid-operation, holding a half-finished result. A machine that works in steps has states that are not answers, and knowing when it is safe to read the output becomes part of using it.`,
 reflect:'Two presses do one complete job. What would you have to add so that one press did the whole job instead — and what would you lose by doing that?'
},
{
 id:'p20', chapter:'Chapter 5 · Sequencing', title:'One Thing at a Time', concept:'synchronised execution',
 problem:`A four-way distributor is on the bench, with a shaft that reports which step it is on. Think of each press of the crank as one tick of a clock: at every tick exactly one thing is allowed to happen, and the machine always knows which. Your job is a four-phase cycle that leaves the accumulator holding twice the input.`,
 objective:'Build a four-tick cycle: clear the accumulator, add the input, add the input again, then rest — with the phase shown on a readout.',
 constraints:['One crank only.','Exactly one operation per tick.','After four ticks the phase readout must be back at 0.'],
 fixed:[{type:'crank',id:'setB',label:'Set input',x:20,y:20},
        {type:'wheel',id:'B',label:'Input wheel',N:10,x:200,y:10},
        {type:'crank',id:'tick',label:'CLOCK',x:20,y:250},
        {type:'seq4',id:'seq',label:'Phase distributor',x:190,y:250},
        {type:'readout',id:'dPhase',label:'Phase readout',x:190,y:430},
        {type:'transfer',id:'armClear',label:'Clearing arm',x:400,y:190},
        {type:'transfer',id:'armAdd',label:'Adding arm',x:400,y:370},
        {type:'wheel',id:'A',label:'Accumulator',N:10,x:640,y:250},
        {type:'readout',id:'dA',label:'Accumulator readout',x:870,y:280}],
 parts:[],
 tests:[
  {label:'Input 3, four ticks → 6',actions:[T('setB',3),T('tick',4)],expect:[{comp:'dA',prop:'value',eq:6},{comp:'dPhase',prop:'value',eq:0}]},
  {label:'Input 4, four ticks → 8',actions:[T('setB',4),T('tick',4)],expect:[{comp:'dA',prop:'value',eq:8}]},
  {label:'Phase readout counts the ticks',actions:[T('tick',2)],expect:[{comp:'dPhase',prop:'value',eq:2}]},
  {label:'A second cycle gives the same answer',actions:[T('setB',3),T('tick',8)],expect:[{comp:'dA',prop:'value',eq:6},{comp:'dPhase',prop:'value',eq:0}]},
  {label:'Stopping halfway leaves an unfinished figure',actions:[T('setB',3),T('tick',2)],expect:[{comp:'dA',prop:'value',eq:3}]},
  {label:'Input 0 gives 0',actions:[T('setB',0),T('tick',4)],expect:[{comp:'dA',prop:'value',eq:0}]}
 ],
 hints:[
  'Four outputs, four phases. Decide what each phase should do before you wire anything.',
  'Phase 0 clears. Phases 1 and 2 both add the input. Phase 3 does nothing at all — and a phase that does nothing still needs to exist.',
  'Two different outputs of the distributor can trigger the same adding arm; an output feeding one input, twice over, is just two rods.',
  'CLOCK → distributor IN. OUT-0 → clearing arm TRIGGER. OUT-1 and OUT-2 → adding arm TRIGGER. OUT-3 → nothing. A VALUE → clearing arm COUNT, clearing arm OUT → A STEP−. B VALUE → adding arm COUNT, adding arm OUT → A STEP+. Distributor STEP → phase readout, A VALUE → accumulator readout.'
 ],
 explain:`Your machine now has a notion of <i>now</i>.

Before this puzzle, an operation happened whenever somebody pressed the right crank. Now every operation is assigned to a phase, and the phase counter decides which one is live. Nothing can happen at the wrong moment, because nothing is connected to a moment it does not own.

This is <b>synchronised execution</b>, and the fourth phase — the one that does nothing — is not waste. It is there because the cycle must return to a known state, and because a machine usually needs a moment when nothing is moving and everything can be safely read. Real processors do the same thing: idle phases exist so that the parts have somewhere quiet to settle.`,
 reflect:'To make this machine compute three times the input instead of twice, you would rewire a distributor output. Where else could the description of what to do at each phase live, so that changing it did not mean touching the wiring?'
},
{
 id:'p21', chapter:'Chapter 5 · Sequencing', title:'The Program Drum', concept:'a program as encoded data',
 problem:`Changing what the machine does still means changing rods. A drum has been fitted: a barrel with four slots, each carrying pegs in two tracks. Two tracks means four possible patterns, and you have four operations. The drum names one operation per slot — but nothing is listening to it yet.`,
 objective:'Wire the drum through the selector tree so that pressing EXECUTE performs whichever operation the current slot names, and ADVANCE turns the drum to the next slot.',
 constraints:['No peg in either track means add the input. Track B alone means clear. Track A alone means add one. Both pegs mean do nothing.','The drum must be advanced only by the ADVANCE crank.'],
 fixed:[{type:'crank',id:'setB',label:'Set input',x:20,y:20},
        {type:'wheel',id:'B',label:'Input wheel',N:10,x:190,y:10},
        {type:'drum',id:'drum',label:'Program drum',program:[[0,1],[0,0],[1,0],[0,0]],x:20,y:210},
        {type:'crank',id:'adv',label:'ADVANCE',x:20,y:390},
        {type:'crank',id:'exec',label:'EXECUTE',x:20,y:550},
        {type:'selector',id:'S1',label:'Selector 1',x:270,y:400},
        {type:'selector',id:'S2',label:'Selector 2',x:470,y:290},
        {type:'selector',id:'S3',label:'Selector 3',x:470,y:520},
        {type:'transfer',id:'armAdd',label:'Adding arm',x:680,y:200},
        {type:'transfer',id:'armClear',label:'Clearing arm',x:680,y:390},
        {type:'wheel',id:'A',label:'Accumulator',N:10,x:920,y:290},
        {type:'readout',id:'dA',label:'Accumulator readout',x:1150,y:320},
        {type:'readout',id:'dSlot',label:'Slot readout',x:270,y:600}],
 parts:[],
 tests:[
  {label:'Slot 0 clears the accumulator',actions:[T('setB',5),T('exec',1)],expect:[{comp:'dA',prop:'value',eq:0},{comp:'dSlot',prop:'value',eq:0}]},
  {label:'Slot 1 adds the input',actions:[T('setB',3),T('exec',1),T('adv',1),T('exec',1)],expect:[{comp:'dA',prop:'value',eq:3}]},
  {label:'Slot 2 adds one',actions:[T('setB',3),T('exec',1),T('adv',1),T('exec',1),T('adv',1),T('exec',1)],expect:[{comp:'dA',prop:'value',eq:4},{comp:'dSlot',prop:'value',eq:2}]},
  {label:'The whole drum: 2×input + 1',actions:[T('setB',3),T('exec',1),T('adv',1),T('exec',1),T('adv',1),T('exec',1),T('adv',1),T('exec',1)],expect:[{comp:'dA',prop:'value',eq:7}]},
  {label:'The same drum with input 4 → 9',actions:[T('setB',4),T('exec',1),T('adv',1),T('exec',1),T('adv',1),T('exec',1),T('adv',1),T('exec',1)],expect:[{comp:'dA',prop:'value',eq:9}]},
  {label:'Advancing alone changes nothing but the slot',actions:[T('setB',6),T('adv',3)],expect:[{comp:'dA',prop:'value',eq:0},{comp:'dSlot',prop:'value',eq:3}]}
 ],
 hints:[
  'You built this tree of selectors in Chapter 4, when two hand levers chose one of four boxes. Nothing about the tree has changed.',
  'What has changed is where the two levers come from. The drum has two track shafts and they read exactly like levers.',
  'Track A decides between the top pair of operations and the bottom pair; track B decides within the pair. The EXECUTE pulse is what travels down the tree.',
  'EXECUTE → S1 IN. Drum TRACK-A → S1 PICK. S1 OUT-0 → S2 IN, S1 OUT-1 → S3 IN. Drum TRACK-B → S2 PICK and S3 PICK. S2 OUT-0 → adding arm TRIGGER, S2 OUT-1 → clearing arm TRIGGER, S3 OUT-0 → A STEP+, S3 OUT-1 → nothing. B VALUE → adding arm COUNT, A VALUE → clearing arm COUNT, arms into A, ADVANCE → drum ADVANCE, drum SLOT → slot readout.'
 ],
 explain:`The instructions are no longer built into the machine. They are pegs.

That is the step that separates a calculating machine from a computer. Everything the drum can order was already possible before — the difference is that the order now comes from something you can change without a spanner. A pattern of pegs is a <b>program</b>, and the selector tree is what <b>decodes</b> it: it turns a pattern into a physical path.

Joseph Marie Jacquard drove looms from punched cards in 1804, and barrel organs had been playing pinned cylinders long before that. Babbage\u2019s Analytical Engine, designed from 1837 onward, was to be directed by cards in exactly this spirit. What none of those had, and what you are about to build, is a machine that turns its own drum.`,
 reflect:'You still press EXECUTE and then ADVANCE, in that order, by hand. Where have you seen that problem before, and what part solved it?'
},

 hints:[
  'One press must cause two things, in a fixed order. The distributor deals one pulse per output, so a single pulse from the crank can only ever do half a cycle.',
  'Which comes first? If the drum turned before the operation ran, every instruction would be performed one slot too late.',
  'The distributor\u2019s first output should carry out the instruction; its second should turn the drum.',
  'RUN → cam IN. Cam OUT → cycle distributor IN. Distributor OUT-0 → S1 IN (the execute path, wired exactly as before). Distributor OUT-1 → drum ADVANCE. Everything else stays as it was in the previous puzzle.'
 ],
 explain:`What you have built has a name: the <b>instruction cycle</b>. Fetch what the drum currently says, carry it out, move on, repeat.

Every computer since has run this loop, and the parts have kept their names. The drum is program memory. The slot number is the program counter. The selector tree is the instruction decoder. The distributor is the control unit that says which part of the cycle is happening now. The accumulator is where the arithmetic lands.

The machine still cannot decide anything — it performs slot 0, 1, 2, 3, 0, 1, 2, 3 for ever, whatever the numbers turn out to be. Chapter 6 is about the part that is missing: something that can look at a result and change which slot comes next.`,
 reflect:'The drum always advances by exactly one slot. If a peg could instead send it back to slot 0, what could this machine do that it cannot do now?'
},

 hints:[
  'The detector needs something to feel. Its input is square, so it wants a reading, not a push.',

 explain:`The flag reports a <b>state</b>, not a history.

Look at the fourth test. After ten turns the flag is raised again — the machine cannot tell "never touched" from "went all the way round". The detector answers one question about the present moment and nothing else, which is what makes it cheap and what makes it dangerous to over-read.

This is a <b>status flag</b>, and it is the first thing in your machine that is a fact <i>about</i> the data rather than the data itself. Every processor has a small set of these — zero, carry, sign, overflow — and they exist for exactly one purpose: to be looked at by something that must choose what to do next.`,

 hints:[
  'The selector is wired exactly as it was in Chapter 4. The only question is what holds its PICK shaft.',
  'PICK reads 1 or 0. The detector produces 1 or 0. Nothing else is required.',

 ],
 explain:`This is a <b>conditional</b>: the machine takes one of two paths, and which one is decided by the numbers rather than by a person.

Nothing new was built. The selector is the Chapter 4 part; the detector is the Chapter 6 part; the wire between them is the whole idea. What has changed is where authority lives. Until this puzzle, every decision in your machine was made by you, either at the workbench with a spanner or at the lever with your hand. Now a decision is made by the machine, at the moment the pulse arrives, from a fact it worked out for itself.

Note that the condition is tested afresh on every single tick. There is no memory of the previous decision — which is sometimes exactly what you want, and sometimes the source of a very confusing bug.`,

 hints:[
  'Two operations alternate: add the input, then take one off the counter. You built that alternation in Chapter 5.',
  'Something must be able to switch the whole machine off. A gate standing between the crank and everything else can do it.',
  'The gate opens while the counter is not empty. The detector has a shaft that says exactly that, and it is not IS-ZERO.',
  'RUN → gate IN. Counter VALUE → detector WATCH and its readout. Detector NOT-ZERO → gate ENABLE. Gate OUT → distributor IN. Distributor OUT-0 → adding arm TRIGGER, OUT-1 → counter STEP−. Input VALUE → adding arm COUNT and its readout. Adding arm OUT → accumulator STEP+, accumulator VALUE → its readout.'
 ],
 explain:`A <b>loop</b> is three things wired together: a body that does the work, a counter that changes each pass, and a test that decides whether to go round again.

Your machine has all three, and it stops on its own. That last point is worth dwelling on. Nothing tells the machine how many times to run — you set 3 in the counter and turned the crank twenty times, and it did the right thing and then quietly ignored you. The number of repetitions has become <i>data</i> rather than something built into a cam.

Compare this with Chapter 3, where multiplying by four meant fetching a four-notch cam from the drawer. This machine multiplies by whatever number happens to be sitting in the counter. That is the difference between a mechanism and a program.

Get the test wrong and the counter never reaches zero: the machine runs for ever and produces nothing. Mechanical or electronic, an infinite loop is the same mistake.`,

},

 hints:[
  'A minus B is negative exactly when B is larger. You cannot hold a negative number, but you can notice the moment a wheel is stepped below zero.',
  'Work out the four phases before touching a rod. Phase 0 must put the machine back into a known state; phases 1 and 2 do the subtraction; phase 3 has nothing to do.',
  'Phase 0 has two jobs — empty the difference wheel and drop the latch — and one distributor output may push both. The difference wheel\u2019s BORROW is what raises the latch.',
  'COMPARE → cam IN, cam OUT → distributor IN. OUT-0 → wiping arm TRIGGER and → latch CLEAR. D VALUE → wiping arm COUNT, wiping arm OUT → D STEP−. OUT-1 → A arm TRIGGER, A VALUE → A arm COUNT and its readout, A arm OUT → D STEP+. OUT-2 → B arm TRIGGER, B VALUE → B arm COUNT and its readout, B arm OUT → D STEP−. D BORROW → latch SET. Latch STATE → the flag readout.'
 ],
 explain:`Your machine compares two numbers without owning anything that compares.

It subtracts, and it watches for the moment the difference wheel runs off the bottom of its range. That borrow is a momentary event — it exists for an instant during phase 2 and is gone. The latch is what makes it useful: it catches the event and holds it long enough for something else to read it.

This is exactly how a processor does it. A comparison instruction is a subtraction whose numeric result is thrown away, performed for no reason except the flags it leaves behind. And the flags live in a register precisely because the events that set them do not last.

The wiping phase matters as much as the arithmetic. Without it, the latch would still be holding the answer to the previous question, and the machine would confidently report yesterday\u2019s comparison. Clearing the state you are about to depend on is not tidiness — it is correctness.`,
 reflect:'You now have a flag that answers a question about the data, and a drum that decides which instruction runs next. Sketch how you would connect the two so that a program could take one route when B is larger and another when it is not.'
},

 hints:[
  'You built the four-phase skeleton in the previous puzzle. Phase 0 wipes the result wheel, phase 1 brings A in, phase 2 brings B in, phase 3 rests.',
  'Only phase 2 differs from the comparison machine: B must be able to arrive either forwards or backwards.',
  'The B arm has one output, and the result wheel has two inputs. A selector between them, steered by the lever, is the whole difference.',
  'GO → cam IN, cam OUT → distributor IN. OUT-0 → wiping arm TRIGGER, D VALUE → wiping arm COUNT, wiping arm OUT → D STEP−. OUT-1 → A arm TRIGGER, A VALUE → A arm COUNT and its readout, A arm OUT → D STEP+. OUT-2 → B arm TRIGGER, B VALUE → B arm COUNT and its readout, B arm OUT → selector IN. Lever STATE → selector PICK, selector OUT-0 → D STEP+, OUT-1 → D STEP−. D VALUE → result readout and → detector WATCH, detector IS-ZERO → zero flag.'
 ],
 explain:`This is an <b>arithmetic and logic unit</b>: two operands in, an operation chosen by a control signal, one result out, and a flag describing that result.

Everything in it is a part you already had. What makes it a unit rather than a pile of parts is that the operation is now an <i>input</i>. Nothing has to be rebuilt to switch between adding and subtracting — the machine is told, at the moment of use, which of its abilities to exercise.

Try the lever up with A smaller than B. The wheel runs off the bottom and comes round to the top, and the answer looks wrong because a wheel with ten positions cannot hold a negative number. The unit is not broken; it is reporting the only thing it can. Deciding what that wrapped figure means, and noticing the borrow that produced it, is the job of whatever reads the result — as it still is inside every processor today.`,
 reflect:'The lever chooses the operation. In Chapter 5 a drum told the machine what to do at each slot. What would you have to join to what, so a program could choose the operation instead of your hand?'
},

  'The decode tree is the one from Chapter 5, unchanged: the drum\u2019s two tracks steer three selectors.',
  'Slot 0 carries no pegs and means "add the input". Slot 1 carries a peg in track B and means "take one off the counter". Work out which selector output each of those lands on.',
  'The stopping mechanism is the gate from Chapter 6, standing between the crank and everything else, opened by the detector\u2019s NOT-ZERO shaft.',
  'RUN → gate IN, counter VALUE → detector WATCH, detector NOT-ZERO → gate ENABLE. Gate OUT → cam IN, cam OUT → cycle distributor IN. Cycle OUT-0 → S1 IN, OUT-1 → drum ADVANCE. Drum TRACK-A → S1 PICK, S1 OUT-0 → S2 IN, S1 OUT-1 → S3 IN, drum TRACK-B → S2 PICK and S3 PICK. S2 OUT-0 → adding arm TRIGGER, S2 OUT-1 → counter STEP−. Input VALUE → adding arm COUNT, adding arm OUT → accumulator STEP+. Then the four readouts.'
 ],
 explain:`Everything that decides what happens next is now in one place, and it has the parts a textbook would name.

The drum is <b>program memory</b>. The slot number is the <b>program counter</b>. The three selectors are the <b>instruction decoder</b>. The cycle distributor is the thing that says whether the machine is currently carrying out an instruction or moving to the next one. Together they are a <b>control unit</b>, and the loop they run — fetch what the drum says, decode it, execute it, advance — is the instruction cycle every computer has used since.

Compare this bench with the loop you built in Chapter 6. The behaviour is identical and the difference is total: there, the two operations were bolted to two distributor outputs, and changing the program meant changing rods. Here they are pegs. Pull the drum out, put a different one in, and the same machine does something else.

The gate is the one piece a modern processor writes differently. Yours stops the machine dead; a real one would let the program counter carry on to an instruction that says halt. The idea is the same: a condition, tested by the control unit, that decides whether there is a next step.`,
 reflect:'The drum can name four operations and you have used three. What would the fourth have to do for the program itself to decide when to stop, instead of the gate?'

 explain:`One arm now serves four boxes, and it would serve four hundred just as well.

This is a <b>data path</b>: a set of routes along which numbers travel between storage and the units that work on them, shared rather than duplicated. The reason a computer does not need separate hardware for every variable in a program is exactly the reason your bench does not need four adding arms — the operand is <i>selected</i> at the moment of use.

Notice what that costs. The picker must be told which box, so every operation now carries an address as well as an instruction. Sharing the hardware means naming the data, and a large part of what a program actually says is not what to do but what to do it to.

  'Build it in three pieces and test each by hand before joining them: the data path from the boxes to the accumulator, the drive from RUN to the decoder, and the decoder itself.',
  'The data path is the previous puzzle exactly: boxes into the picker, picker into the arm\u2019s COUNT, arm into the accumulator. The address wheel no longer has a crank, because the program turns it.',
  'The drum\u2019s three slots are no pegs, a peg in track B, and a peg in track A. Those are three of the four paths out of the selector tree, and they must land on the adding arm\u2019s TRIGGER, the address wheel\u2019s STEP+, and the pass counter\u2019s STEP−.',
  'Data: each fill crank → its box; each box VALUE → picker IN-0…IN-3; address wheel VALUE → picker ADDR and → address readout; picker VALUE → arm COUNT; arm OUT → accumulator STEP+. Drive: RUN → gate IN; counter VALUE → detector WATCH and → counter readout; detector NOT-ZERO → gate ENABLE; gate OUT → cam IN; cam OUT → cycle IN; cycle OUT-0 → S1 IN; cycle OUT-1 → drum ADVANCE. Decode: drum TRACK-A → S1 PICK; S1 OUT-0 → S2 IN; S1 OUT-1 → S3 IN; drum TRACK-B → S2 PICK and S3 PICK; S2 OUT-0 → arm TRIGGER; S2 OUT-1 → address wheel STEP+; S3 OUT-0 → counter STEP−. Then the accumulator and slot readouts.'
 ],
 explain:`You have built a programmable computer out of wheels, rods and pegs, and it has just run a program.

Look at what is on the bench and what each thing is called. The boxes and the picker are addressable memory. The address wheel is a pointer that the program itself moves. The accumulator and the adding arm are the arithmetic unit. The drum is program storage; its slot number is the program counter; the selector tree is the instruction decoder; the cycle distributor and the gate are the control unit, and the zero detector is the flag that tells the control unit whether to keep going. None of these were designed for this puzzle — every one of them arrived to solve a problem that had nothing to do with computing, and they have been sitting on your bench for chapters.

The program is not the machine. The three slots on that drum say <i>add, step the address, count the pass</i>, and pulling them out and pegging a different pattern would make the same iron do something else entirely. That separation — a fixed machine that reads a changeable description of what to do — is the whole idea, and it is the reason a single design can serve purposes its builder never imagined.

Be clear about what this is not. It is not a physically accurate mechanical simulation: nothing here models force, friction, backlash or the terrifying problem of nine wheels carrying at once, which is what actually defeated most nineteenth-century builders. Babbage designed an Analytical Engine along these lines from 1837 and never finished one; the machines that did get built, from the Pascaline to the arithmometer, were calculators rather than programmable computers. What you have built is the logic those designs were reaching for, laid out where you can see it work.`,
 reflect:'The drum walks the address forward through memory and stops after a counted number of passes. What would you have to change — on the drum alone, without touching a single rod — to make this machine find the largest of the four figures instead of their total?'
}

/* Behaviour-based grading: clone the machine, reset every part, drive the cranks, read the result. */
function resolveRef(m,ref){
  if(ref[0]!=='#') return m.comps[ref]?ref:null;
  const type=ref.slice(1);
  const found=Object.keys(m.comps).filter(id=>m.comps[id].type===type);
  return found.length?found[0]:null;
}
function runTest(machine,puzzle,test){
  const m=cloneMachine(machine);
  resetState(m);
  for(const act of test.actions){
    if(act.lever){
      const lid=resolveRef(m,act.lever);
      if(!lid) return {ok:false,detail:'no lever named '+act.lever};
      m.comps[lid].pos=act.to?1:0;
      continue;
    }
    let id=act.crank||null;
    if(act.crankIdx==='added'){
      const cranks=Object.keys(m.comps).filter(k=>m.comps[k].type==='crank'&&!m.comps[k].fixed);
      id=cranks[0]||null;
    } else if(act.crankIdx&&act.crankIdx[0]==='#') id=resolveRef(m,act.crankIdx);
    if(!id||!m.comps[id]) return {ok:false,detail:'no crank to turn'};
    for(let i=0;i<act.times;i++) firePulse(m,id,'OUT');
  }
  for(const e of test.expect){
    const id=resolveRef(m,e.comp);
    if(!id) return {ok:false,detail:'missing '+e.comp.replace('#','')};
    const got=e.prop==='value'?readValue(m,id):m.comps[id][e.prop];
    if(got!==e.eq) return {ok:false,detail:'expected '+e.eq+', got '+(got===null?'blank':got)};
  }
  return {ok:true,detail:'as expected'};
}
function gradePuzzle(machine,puzzle){
  return puzzle.tests.map(t=>Object.assign({label:t.label},runTest(machine,puzzle,t)));
}
/* =================== PUZZLES-END =================== */

if(typeof module!=='undefined'&&module.exports){
  module.exports={DEFS,PUZZLES,makeMachine,addComp,removeComp,addWire,canWire,firePulse,readValue,readPort,
                  resetState,cloneMachine,gradePuzzle,runTest};
}
