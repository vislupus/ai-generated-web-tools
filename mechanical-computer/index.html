<script>
/* ============ LAYER 3 — USER INTERFACE ============
   Draws parts, handles dragging, zoom, wiring and tests.
   It reads the model and calls into it. The model never calls back. */
(function(){
if(typeof document==='undefined') return;

const SAVE_KEY='mechanical-computer/save', SAVE_VERSION=2;
const Store=(function(){
  let usable=true, mem={};
  try{ localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); }catch(e){ usable=false; }
  return {
    read(){ try{ return usable?localStorage.getItem(SAVE_KEY):mem[SAVE_KEY]; }catch(e){ return null; } },
    write(v){ try{ usable?localStorage.setItem(SAVE_KEY,v):mem[SAVE_KEY]=v; }catch(e){} },
    drop(){ try{ usable?localStorage.removeItem(SAVE_KEY):delete mem[SAVE_KEY]; }catch(e){} },
    usable };
})();
function freshSave(){
  return {version:SAVE_VERSION,current:PUZZLES[0].id,completed:[],unlocked:[PUZZLES[0].id],
          hintsUsed:{},solutions:{},revealed:{},settings:{zoom:1}};
}
function loadSave(){
  const raw=Store.read(); if(!raw) return freshSave();
  let d; try{ d=JSON.parse(raw); }catch(e){ return freshSave(); }
  if(!d||typeof d!=='object') return freshSave();
  /* Version 1 stored part positions that no longer apply. Keep the player's
     progress, throw away the old layouts. Anything older or unknown: start fresh. */
  if(d.version===1){ d={version:SAVE_VERSION,current:d.current,completed:d.completed,
                        unlocked:d.unlocked,hintsUsed:d.hintsUsed,solutions:{},revealed:{},settings:{}}; }
  if(d.version!==SAVE_VERSION) return freshSave();
  const ids=PUZZLES.map(p=>p.id), s=freshSave();
  s.completed=Array.isArray(d.completed)?d.completed.filter(i=>ids.includes(i)):[];
  s.unlocked=Array.isArray(d.unlocked)?d.unlocked.filter(i=>ids.includes(i)):[];
  if(!s.unlocked.includes(PUZZLES[0].id)) s.unlocked.push(PUZZLES[0].id);
  s.current=ids.includes(d.current)?d.current:PUZZLES[0].id;
  if(d.hintsUsed&&typeof d.hintsUsed==='object') s.hintsUsed=d.hintsUsed;
  if(d.solutions&&typeof d.solutions==='object') s.solutions=d.solutions;
  if(d.revealed&&typeof d.revealed==='object') s.revealed=d.revealed;
  if(d.settings&&typeof d.settings==='object'){
    const z=Number(d.settings.zoom);
    s.settings.zoom=(isFinite(z)&&z>=.4&&z<=2)?z:1;
  }
  return s;
}
let save=loadSave();
let puzzle=PUZZLES.find(p=>p.id===save.current)||PUZZLES[0];
let machine, armed=null, hintsShown=0, zoom=save.settings.zoom||1;
const $=s=>document.querySelector(s);

function persist(){

    comps:Object.keys(machine.comps).map(id=>{

    }),

function openPuzzle(id){

function renderBrief(){

function renderMap(){

/* The digits orbit with the wheel but each one counter-rotates so it always
   reads upright, the way a printed number band does on a real counter. */
function dialSVG(c){
  const N=c.N, r=33, spin=(c.pos/N)*360;
  let digits='';
  for(let i=0;i<N;i++){
    const a=(i/N)*2*Math.PI-Math.PI/2;
    const x=(50+r*Math.cos(a)).toFixed(1), y=(50+r*Math.sin(a)).toFixed(1);
    digits+='<text class="digit'+(i===c.pos?' on':'')+'" x="'+x+'" y="'+y+'" '+
            'style="transform:rotate('+spin+'deg);transform-box:fill-box;transform-origin:center">'+i+'</text>';
  }
  /* The viewBox starts above the rim so the pointer can sit clear of the
     digits, tip downwards, the way an index finger sits over a dial. */
  return '<svg class="dial" viewBox="0 -12 100 112" width="84" height="94" aria-label="wheel showing '+c.pos+'">'+
    '<circle class="face" cx="50" cy="50" r="44"/><circle class="ring" cx="50" cy="50" r="23"/>'+
    '<g class="rotor" style="transform:rotate('+(-spin)+'deg)">'+digits+'</g>'+
    '<polygon class="pointer" points="50,2 44,-9 56,-9"/></svg>'+
    '<div class="readchip">'+c.pos+'</div>';
}
function bodyHTML(id,c){
  if(c.type==='wheel') return dialSVG(c);
  if(c.type==='crank') return '<button class="crank-btn" data-crank="'+id+'">TURN</button>';
  if(c.type==='bell') return '<div class="bell'+(c.count>0?' lit':'')+'">'+(c.count||0)+'</div>';
  if(c.type==='repeater') return '<div class="cam">×'+c.times+'</div>';
  if(c.type==='transfer'){ const n=readPort(machine,id,'COUNT');
    return '<div class="arm">sends '+(n===null?'—':n)+'</div>'; }
  if(c.type==='lever')
    return '<button class="lever'+(c.pos?' up':'')+'" data-lever="'+id+'">'+
           '<span class="lever-arm"></span><b>'+(c.pos?'1':'0')+'</b></button>';
  if(c.type==='gate'){ const on=readPort(machine,id,'ENABLE');
    return '<div class="chip'+(on?' on':'')+'">'+(on?'OPEN':'SHUT')+'</div>'; }
  if(c.type==='selector'){ const p=readPort(machine,id,'PICK');
    return '<div class="chip on">path '+(p?'1':'0')+'</div>'; }
  if(c.type==='picker'){ const a=readPort(machine,id,'ADDR')||0, v=valueOf(machine,id,'VALUE');
    return '<div class="picker"><span>addr '+a+'</span><b>'+(v===null?'—':v)+'</b></div>'; }
  if(c.type==='zero'){ const v=readPort(machine,id,'WATCH');
    return '<div class="chip'+(v===0?' on':'')+'">'+(v===null?'nothing to feel':(v===0?'AT ZERO':'not zero'))+'</div>'; }
  if(c.type==='latch')
    return '<div class="chip'+(c.pos?' on':'')+'">'+(c.pos?'SET · 1':'clear · 0')+'</div>';
  if(c.type==='seq2'||c.type==='seq4')
    return '<div class="chip on">step '+c.step+'</div>';
  if(c.type==='drum')
    return '<div class="drum">'+c.program.map((ins,i)=>
      '<div class="slot'+(i===c.slot?' on':'')+'"><i class="pg'+(ins[0]?' on':'')+'"></i>'+
      '<i class="pg'+(ins[1]?' on':'')+'"></i><u>'+i+'</u></div>').join('')+'</div>';
  if(c.type==='readout'){ const v=readValue(machine,id);
    return '<div class="screen'+(v===null?' blank':'')+'">'+(v===null?'—':v)+'</div>'; }
  return '';
}
function renderBench(){
  const canvas=$('#canvas');
  [...canvas.querySelectorAll('.comp')].forEach(n=>n.remove());
  Object.keys(machine.comps).forEach(id=>{
    const c=machine.comps[id], def=DEFS[c.type];
    const el=document.createElement('div');
    el.className='comp'; el.dataset.id=id;
    el.style.left=c.x+'px'; el.style.top=c.y+'px';
    el.innerHTML='<div class="grip" data-grip="'+id+'">'+c.label+'</div>'+bodyHTML(id,c)+
                 (c.fixed?'':'<button class="comp-kill" title="Remove part" data-kill="'+id+'">×</button>');
    def.ins.forEach((p,i)=>addPort(el,id,'in',p,i,def.ins.length));
    def.outs.forEach((p,i)=>addPort(el,id,'out',p,i,def.outs.length));
    canvas.appendChild(el);
  });
  requestAnimationFrame(()=>{ fitCanvas(); drawWires(); paintSelection(); });
  $('#wirecount').textContent=machine.wires.length+' rod'+(machine.wires.length===1?'':'s')+
    (armed?' · now pick an input':'');
}
function addPort(el,compId,dir,p,i,total){
  const top=26+((100-26)/(total+1))*(i+1)*0.9;
  const b=document.createElement('button');
  b.className='port '+dir+' '+p.kind+
    (armed&&armed.id===compId&&armed.port===p.id&&armed.dir===dir?' armed':'');
  b.style.top=top+'%';
  b.dataset.comp=compId; b.dataset.port=p.id; b.dataset.dir=dir;
  b.title=p.id+' · '+p.kind;
  b.setAttribute('aria-label',p.id+' '+p.kind+' '+dir+'put');
  const lab=document.createElement('span');
  lab.className='plabel '+dir; lab.style.top=top+'%'; lab.textContent=p.id;
  el.appendChild(b); el.appendChild(lab);
}
function portCentre(compId,dir,portId){
  const el=document.querySelector('.comp[data-id="'+compId+'"]');
  if(!el) return null;
  const p=[...el.querySelectorAll('.port')].find(n=>n.dataset.port===portId&&n.dataset.dir===dir);
  if(!p) return null;
  /* The port is shifted up by half its height with translateY(-50%), and
     offsetTop reports the position before that transform. So the visual
     centre sits exactly at offsetTop, not offsetTop + height/2. */
  return {x:el.offsetLeft+p.offsetLeft+p.offsetWidth/2, y:el.offsetTop+p.offsetTop};
}
function drawWires(){
  const svg=$('#wires'); svg.innerHTML='';
  machine.wires.forEach((w,i)=>{
    const a=portCentre(w.from,'out',w.fromPort), b=portCentre(w.to,'in',w.toPort);
    if(!a||!b) return;
    const dx=Math.max(40,Math.abs(b.x-a.x)*0.45);
    const d='M '+a.x+' '+a.y+' C '+(a.x+dx)+' '+a.y+', '+(b.x-dx)+' '+b.y+', '+b.x+' '+b.y;
    const kind=portDef(machine.comps[w.from].type,'out',w.fromPort).kind;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d); path.setAttribute('fill','none');
    path.setAttribute('stroke',kind==='value'?'#5FBFA6':'#D8A63D');
    path.setAttribute('stroke-width','2'); path.setAttribute('opacity','.8');
    if(kind==='value') path.setAttribute('stroke-dasharray','5 4');
    path.dataset.wire=i; svg.appendChild(path);
    const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d',d); hit.setAttribute('class','hit'); hit.dataset.wire=i;
    hit.addEventListener('click',()=>{ machine.wires.splice(i,1); persist(); renderBench(); });
    svg.appendChild(hit);
  });
}
function animatePulse(trace){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!trace.length) return;
  const svg=$('#wires'), seen=new Map();
  trace.forEach(t=>{
    const idx=machine.wires.indexOf(t.wire);
    if(seen.has(idx)&&seen.get(idx)>3) return;
    seen.set(idx,(seen.get(idx)||0)+1);
    const path=svg.querySelector('path[data-wire="'+idx+'"]:not(.hit)');
    if(!path) return;
    const bead=document.createElementNS('http://www.w3.org/2000/svg','circle');
    bead.setAttribute('r','4'); bead.setAttribute('fill','#EFE8D7'); svg.appendChild(bead);
    const len=path.getTotalLength(), t0=performance.now()+t.depth*140;
    (function tick(now){
      const p=Math.min(1,Math.max(0,(now-t0)/260));
      const pt=path.getPointAtLength(len*p);
      bead.setAttribute('cx',pt.x); bead.setAttribute('cy',pt.y);
      if(p<1) requestAnimationFrame(tick); else bead.remove();
    })(performance.now());
  });
}

function renderParts(){
  const box=$('#parts');
  if(!puzzle.parts.length){
    box.innerHTML='<div class="prose" style="font-size:13px;color:var(--muted)">Everything you need is already on the bench. This puzzle is about how the parts are joined, not which parts you have.</div>';
    return;

  puzzle.parts.forEach(spec=>{
    const have=Object.keys(machine.comps).filter(id=>machine.comps[id].type===spec.type&&!machine.comps[id].fixed).length;
    const def=DEFS[spec.type];

    b.className='part'; b.disabled=have>=spec.max;
    b.innerHTML='<span><b>'+def.label+(spec.N?' · '+spec.N:'')+'</b><small>'+def.blurb+'</small></span>'+
                '<span class="qty">'+(spec.max-have)+' left</span>';
    b.onclick=()=>{
      const base=puzzle.dropAt||{x:60,y:60};
      const n=Object.keys(machine.comps).filter(k=>!machine.comps[k].fixed).length;
      addComp(machine,spec.type,{N:spec.N||10,times:spec.times,x:base.x+n*230,y:base.y},false);
      persist(); renderBench(); renderParts();
    };

}
const HINT_TITLES=['Where to look','A strategy','How the parts relate','Almost the whole answer'];
function partName(id){
  if(machine.comps[id]) return machine.comps[id].label;
  const s=puzzle.solution&&(puzzle.solution.add||[]).find(a=>a.id===id);
  return s?(s.label||DEFS[s.type].label):id;
}
function solutionLines(){
  const s=puzzle.solution; if(!s) return [];
  const add=(s.add||[]).map(a=>
    '<div class="step">Take a '+(a.label||DEFS[a.type].label).toLowerCase()+' from the parts bin.</div>');
  return add.concat(s.wires.map(w=>
    '<div class="row"><span class="from">'+partName(w[0])+' <b>'+w[1]+'</b></span>'+
    '<span class="to">→ '+partName(w[2])+' <b>'+w[3]+'</b></span></div>'));
}
function buildSolution(){
  const s=puzzle.solution; if(!s) return;
  Object.keys(machine.comps).forEach(id=>{ if(!machine.comps[id].fixed) removeComp(machine,id); });
  machine.wires=[];
  const base=puzzle.dropAt||{x:60,y:60};
  (s.add||[]).forEach((a,i)=>addComp(machine,a.type,
    {id:a.id,label:a.label,N:a.N,times:a.times,x:base.x+i*230,y:base.y},false));
  s.wires.forEach(w=>addWire(machine,w[0],w[1],w[2],w[3]));
  armed=null; persist(); renderBench(); renderParts();
  requestAnimationFrame(()=>requestAnimationFrame(zoomToFit));
}
function renderHints(){
  const box=$('#hints'), done=hintsShown>=puzzle.hints.length;
  let html=hintsShown===0
    ? '<div class="prose" style="font-size:13px;color:var(--muted)">Hints arrive one at a time and never solve the puzzle for you. Using them costs nothing.</div>'
    : puzzle.hints.slice(0,hintsShown).map((h,i)=>'<div class="hint"><b>Hint '+(i+1)+' · '+HINT_TITLES[i]+'</b>'+h+'</div>').join('');
  if(done&&puzzle.solution){
    html+= save.revealed[puzzle.id]
      ? '<div class="hint"><b>The answer</b><div class="answer">'+
        solutionLines().join('')+'</div>'+
        '<button class="btn" id="btn-build" style="width:100%;margin-top:9px">Build it on the bench</button></div>'
      : '<button class="btn" id="btn-reveal" style="width:100%;margin-top:4px">Show me the answer</button>';
  }
  box.innerHTML=html;
  const rv=$('#btn-reveal');
  if(rv) rv.onclick=()=>{ save.revealed[puzzle.id]=true; persist(); renderHints(); };
  const bd=$('#btn-build');
  if(bd) bd.onclick=buildSolution;
  const btn=$('#btn-hint');
  btn.disabled=done;
  btn.textContent=done?'No hints left':'Ask for a hint';
}

function runAllTests(){
  const results=gradePuzzle(machine,puzzle), box=$('#test-results');
  box.innerHTML=results.map(r=>
    '<div class="trow"><span class="tmark '+(r.ok?'pass':'fail')+'">'+(r.ok?'✓':'✗')+'</span><span>'+r.label+
    '</span><span class="tdetail">'+r.detail+'</span></div>').join('');
  const passed=results.every(r=>r.ok);
  const v=document.createElement('div');
  v.className='verdict '+(passed?'pass':'fail');
  v.textContent=passed?'Every test passes. The machine behaves as ordered.'
                      :'Not there yet. Read the first failing line — it says what the bench expected.';
  box.appendChild(v);
  if(passed) complete();
}
function complete(){
  if(!save.completed.includes(puzzle.id)) save.completed.push(puzzle.id);
  const i=PUZZLES.indexOf(puzzle), next=PUZZLES[i+1];
  if(next&&!save.unlocked.includes(next.id)) save.unlocked.push(next.id);
  persist(); renderMap(); showModal(next);
}
function showModal(next){
  $('#modal').className='modal';
  const used=save.hintsUsed[puzzle.id]||0;
  $('#modal').innerHTML=
    '<div class="eyebrow">Solved · '+puzzle.concept+'</div><h2>'+puzzle.title+'</h2>'+
    '<div class="prose">'+puzzle.explain.split('\n\n').map(p=>'<p>'+p+'</p>').join('')+'</div>'+
    '<div class="reflect"><b>Think it over</b>'+puzzle.reflect+'</div>'+
    (used?'<div class="prose" style="font-size:12px;color:var(--muted)">Hints opened: '+used+'. They are there to be used.</div>':'')+
    '<div class="modal-actions"><button class="btn" id="m-stay">Stay on this bench</button>'+
    (next?'<button class="btn primary" id="m-next">Next: '+next.title+'</button>'
         :'<button class="btn primary" id="m-stay2">That is the last puzzle so far</button>')+'</div>';
  $('#veil').hidden=false;
  ['#m-stay','#m-stay2'].forEach(s=>{ const b=$(s); if(b) b.onclick=closeModal; });
  const n=$('#m-next'); if(n) n.onclick=()=>{ closeModal(); openPuzzle(next.id); };
}
/* ---------- parts library ----------
   Drawings of what each part would be if it were made of metal. They are
   sketches to think with, not engineering drawings: the simulation models the
   logic of these mechanisms, never their forces, friction or tolerances. */
function ratchetTeeth(cx,cy,r,n){
  let d='';
  for(let i=0;i<n;i++){
    const a=(i/n)*2*Math.PI, b=((i+.55)/n)*2*Math.PI;
    d+='M '+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)+
       ' L '+(cx+(r+6)*Math.cos(b)).toFixed(1)+' '+(cy+(r+6)*Math.sin(b)).toFixed(1)+
       ' L '+(cx+r*Math.cos(b)).toFixed(1)+' '+(cy+r*Math.sin(b)).toFixed(1)+' Z ';
  }
  return d;
}
function lobePath(cx,cy,lobes){
  let pts=[];
  for(let i=0;i<=120;i++){
    const t=(i/120)*2*Math.PI, rr=20+7*Math.cos(lobes*t);
    pts.push((cx+rr*Math.cos(t)).toFixed(1)+','+(cy+rr*Math.sin(t)).toFixed(1));
  }
  return pts.join(' ');
}

/* ---------- zoom and canvas size ----------
   The canvas is never bigger than the machine standing on it, so the scrollbars
   only appear when there is genuinely something out of sight. */
function fitCanvas(){
  const canvas=$('#canvas'); let w=320,h=180;
  canvas.querySelectorAll('.comp').forEach(el=>{
    w=Math.max(w,el.offsetLeft+el.offsetWidth);
    h=Math.max(h,el.offsetTop+el.offsetHeight);
  });
  w+=40; h+=30;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  /* A CSS transform does not change how much room an element takes up, so the
     sizer carries the scaled footprint. Without it the scrollbars would stay
     even when the machine has been zoomed down to nothing. */
  const sz=$('#sizer');
  sz.style.width=Math.ceil(w*zoom)+'px'; sz.style.height=Math.ceil(h*zoom)+'px';
  if(!document.fullscreenElement)
    $('#viewport').style.height=Math.min(620,Math.max(200,Math.ceil(h*zoom)+6))+'px';
  return {w,h};
}
function applyZoom(){
  $('#canvas').style.transform='scale('+zoom+')';
  $('#z-label').textContent=Math.round(zoom*100)+'%';
  fitCanvas();
}
function setZoom(z){ zoom=Math.min(1.8,Math.max(.35,Math.round(z*100)/100)); applyZoom(); persist(); }
function zoomToFit(){
  const {w}=fitCanvas();
  const vpw=$('#viewport').clientWidth-4;
  if(vpw>60) setZoom(Math.min(1,vpw/w));
}
$('#z-in').onclick=()=>setZoom(zoom+.1);
$('#z-out').onclick=()=>setZoom(zoom-.1);
$('#z-fit').onclick=zoomToFit;
$('#z-full').onclick=()=>{
  const w=$('#bench-wrap');
  if(document.fullscreenElement) document.exitFullscreen();
  else if(w.requestFullscreen) w.requestFullscreen();
};
$('#viewport').addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey) return;
  e.preventDefault(); setZoom(zoom+(e.deltaY<0?.08:-.08));
},{passive:false});

const selected=new Set();
function paintSelection(){
  document.querySelectorAll('.comp').forEach(el=>
    el.classList.toggle('sel',selected.has(el.dataset.id)));
}
function clearSelection(){ selected.clear(); paintSelection(); }
/* Shift-click a name plate to add or remove a part from the selection.
   Dragging any selected part moves the whole group together. */
$('#canvas').addEventListener('pointerdown',e=>{
  const grip=e.target.closest('[data-grip]'); if(!grip) return;
  const id=grip.dataset.grip;
  if(!machine.comps[id]) return;
  if(e.shiftKey){
    selected.has(id)?selected.delete(id):selected.add(id);
    paintSelection(); e.preventDefault(); return;
  }
  if(!selected.has(id)){ selected.clear(); selected.add(id); }
  paintSelection();
  const ids=[...selected].filter(i=>machine.comps[i]);
  drag={ids,sx:e.clientX,sy:e.clientY,
        start:ids.map(i=>({i,x:machine.comps[i].x,y:machine.comps[i].y})),
        els:ids.map(i=>document.querySelector('.comp[data-id="'+i+'"]'))};
  drag.els.forEach(el=>el&&el.classList.add('dragging'));
  e.preventDefault();
});
window.addEventListener('pointermove',e=>{
  if(drag){
    const dx=(e.clientX-drag.sx)/zoom, dy=(e.clientY-drag.sy)/zoom;
    drag.start.forEach((st,k)=>{
      const c=machine.comps[st.i]; if(!c) return;
      c.x=Math.max(0,Math.round(st.x+dx)); c.y=Math.max(0,Math.round(st.y+dy));
      const el=drag.els[k]; if(el){ el.style.left=c.x+'px'; el.style.top=c.y+'px'; }
    });
    drawWires();
  } else if(pan){
    const vp=$('#viewport');
    vp.scrollLeft=pan.sl-(e.clientX-pan.x);
    vp.scrollTop=pan.st-(e.clientY-pan.y);
  }
});
window.addEventListener('pointerup',()=>{
  if(drag){ drag.els.forEach(el=>el&&el.classList.remove('dragging')); drag=null; persist(); fitCanvas(); }
  pan=null;
});
document.addEventListener('fullscreenchange',()=>{
  if(document.fullscreenElement) $('#viewport').style.height='';
  else fitCanvas();
});
$('#viewport').addEventListener('pointerdown',e=>{
  if(e.target.closest('.comp')) return;
  if(!e.shiftKey) clearSelection();
  const vp=$('#viewport');
  pan={x:e.clientX,y:e.clientY,sl:vp.scrollLeft,st:vp.scrollTop};
});

/* ---------- wiring and cranks ---------- */
$('#canvas').addEventListener('click',e=>{
  const kill=e.target.closest('[data-kill]');
  if(kill){ removeComp(machine,kill.dataset.kill); armed=null; persist(); renderBench(); renderParts(); return; }
  const lev=e.target.closest('[data-lever]');
  if(lev){ const c=machine.comps[lev.dataset.lever]; c.pos=c.pos?0:1; persist(); renderBench(); return; }
  const crank=e.target.closest('[data-crank]');
  if(crank){ const trace=firePulse(machine,crank.dataset.crank,'OUT'); renderBench();
             requestAnimationFrame(()=>animatePulse(trace)); return; }
  const port=e.target.closest('.port'); if(!port) return;
  const ref={id:port.dataset.comp,port:port.dataset.port,dir:port.dataset.dir};
  if(!armed){
    if(ref.dir!=='out'){ toast('Start from an output — the right-hand edge of a part.'); return; }
    armed=ref; renderBench(); return;
  }
  if(armed.id===ref.id&&armed.port===ref.port&&armed.dir===ref.dir){ armed=null; renderBench(); return; }
  if(ref.dir!=='in'){ armed=ref; renderBench(); return; }
  const bad=addWire(machine,armed.id,armed.port,ref.id,ref.port);
  if(bad) toast('Cannot connect: '+bad);
  armed=null; persist(); renderBench();
});

$('#btn-hint').onclick=()=>{
  if(hintsShown>=puzzle.hints.length) return;
  hintsShown++; save.hintsUsed[puzzle.id]=hintsShown; persist(); renderHints();
};
$('#btn-test').onclick=runAllTests;
$('#btn-clear').onclick=()=>{ machine.wires=[]; armed=null; persist(); renderBench(); };
$('#btn-tidy').onclick=()=>{
  const fresh=makeMachine(puzzle);
  Object.keys(machine.comps).forEach(id=>{
    if(fresh.comps[id]){ machine.comps[id].x=fresh.comps[id].x; machine.comps[id].y=fresh.comps[id].y; }
  });
  persist(); renderBench();
};
$('#btn-reset').onclick=()=>{
  if(!confirm('Erase all progress and start again from the first puzzle?')) return;
  Store.drop(); save=freshSave(); zoom=1; openPuzzle(PUZZLES[0].id);
};
$('#btn-library').onclick=openLibrary;
$('#veil').addEventListener('click',e=>{ if(e.target.id==='veil') closeModal(); });
window.addEventListener('resize',()=>requestAnimationFrame(drawWires));
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ armed=null; clearSelection(); closeModal(); renderBench(); }
  if((e.key==='Delete'||e.key==='Backspace')&&selected.size&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    let removed=0;
    selected.forEach(id=>{ if(machine.comps[id]&&!machine.comps[id].fixed){ removeComp(machine,id); removed++; } });
    clearSelection();
    if(removed){ e.preventDefault(); persist(); renderBench(); renderParts(); }
  }
});

openPuzzle(save.current);
if(!Store.usable) toast('This preview cannot save to the browser. Download the file to keep progress.');
})();
</script>
</body>
</html>
